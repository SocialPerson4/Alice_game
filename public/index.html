<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>奇域梦幻漫游录</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Noto+Serif+SC:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Serif SC', 'Cinzel', serif;
            overflow: hidden;
            background: url('img/背景.png') center center / cover no-repeat,
                        linear-gradient(135deg, #1a4a5c, #2d5a87, #4a5d8a, #6b4c93);
            background-attachment: fixed;
            color: white;
            height: 100vh;
            cursor: none;
        }

        /* 自定义光标 */
        .custom-cursor {
            position: fixed;
            width: 30px;
            height: 30px;
            border: 2px solid rgba(173, 216, 230, 0.8);
            border-radius: 50%;
            pointer-events: none;
            z-index: 10000;
            transition: all 0.1s ease;
            backdrop-filter: blur(2px);
            background: radial-gradient(circle, rgba(173, 216, 230, 0.2), transparent);
            box-shadow: 0 0 20px rgba(173, 216, 230, 0.5);
        }

        /* 禁用自定义光标时的样式 */
        body.no-custom-cursor .custom-cursor {
            display: none !important;
        }

        body.no-custom-cursor {
            cursor: auto;
        }

        /* 禁用粒子效果时的样式 */
        body.no-particles .background-canvas {
            display: none !important;
        }

        .custom-cursor.hover {
            width: 50px;
            height: 50px;
            border-color: rgba(255, 182, 193, 1);
            box-shadow: 0 0 30px rgba(255, 182, 193, 0.8);
        }

        /* 背景粒子系统 */
        .background-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 主容器 */
        .game-container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }

        /* 游戏标题区域 */
        .title-section {
            position: relative;
            text-align: center;
            margin-bottom: 50px;
            z-index: 10;
        }

        .game-title {
            font-size: 4.5rem;
            font-weight: 900;
            font-family: 'Cinzel', 'Noto Serif SC', serif;
            background: linear-gradient(45deg, #87ceeb, #add8e6, #b0e0e6, #87ceeb);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: title-glow 3s ease-in-out infinite, title-gradient 2s linear infinite;
            text-shadow: 0 0 50px rgba(173, 216, 230, 0.5);
            letter-spacing: 4px;
            margin-bottom: 20px;
            position: relative;
        }

        .game-title::before {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shine 3s ease-in-out infinite;
        }

        .game-subtitle {
            font-size: 1.8rem;
            color: rgba(255, 255, 255, 0.9);
            font-family: 'Noto Serif SC', serif;
            letter-spacing: 2px;
            animation: subtitle-float 4s ease-in-out infinite;
            text-shadow: 0 0 20px rgba(255, 182, 193, 0.6);
        }

        /* 中央游戏区域 */
        .game-main-area {
            display: none;
        }

        /* 仙境时钟 */
        .wonderland-clock {
            width: 180px;
            height: 180px;
            border: 3px solid rgba(173, 216, 230, 0.8);
            border-radius: 50%;
            position: fixed;
            bottom: 5%;
            right: 5%;
            background: 
                radial-gradient(circle at center, 
                    rgba(255, 255, 255, 0.1) 0%, 
                    rgba(173, 216, 230, 0.08) 40%, 
                    rgba(255, 182, 193, 0.05) 100%);
            backdrop-filter: blur(10px);
            box-shadow: 
                0 0 40px rgba(173, 216, 230, 0.4),
                inset 0 0 20px rgba(255, 255, 255, 0.1);
            z-index: 20;
            animation: clock-rotation 12s linear infinite;
        }

        .wonderland-clock::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 130px;
            height: 130px;
            border: 2px dashed rgba(255, 182, 193, 0.6);
            border-radius: 50%;
            animation: rotate-reverse 18s linear infinite;
            box-shadow: 0 0 20px rgba(255, 182, 193, 0.3);
        }

        .wonderland-clock::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            border: 1px dotted rgba(255, 215, 0, 0.7);
            border-radius: 50%;
            animation: rotate 8s linear infinite;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }

        /* 仙境符号 */
        .wonderland-symbol {
            position: absolute;
            font-size: 1.2rem;
            color: rgba(173, 216, 230, 0.9);
            animation: symbol-glow 4s ease-in-out infinite;
            font-family: 'Cinzel', serif;
            text-shadow: 0 0 10px rgba(173, 216, 230, 0.4);
            font-weight: 600;
        }

        .wonderland-symbol:nth-child(1) { 
            top: 8%; 
            left: 50%; 
            transform: translateX(-50%); 
            animation-delay: 0s; 
        }
        .wonderland-symbol:nth-child(2) { 
            top: 25%; 
            right: 15%; 
            animation-delay: 0.5s; 
        }
        .wonderland-symbol:nth-child(3) { 
            top: 50%; 
            right: 8%; 
            transform: translateY(-50%); 
            animation-delay: 1s; 
        }
        .wonderland-symbol:nth-child(4) { 
            bottom: 25%; 
            right: 15%; 
            animation-delay: 1.5s; 
        }
        .wonderland-symbol:nth-child(5) { 
            bottom: 8%; 
            left: 50%; 
            transform: translateX(-50%); 
            animation-delay: 2s; 
        }
        .wonderland-symbol:nth-child(6) { 
            bottom: 25%; 
            left: 15%; 
            animation-delay: 2.5s; 
        }
        .wonderland-symbol:nth-child(7) { 
            top: 50%; 
            left: 8%; 
            transform: translateY(-50%); 
            animation-delay: 3s; 
        }
        .wonderland-symbol:nth-child(8) { 
            top: 25%; 
            left: 15%; 
            animation-delay: 3.5s; 
        }

        /* 中央镜子 */
        .center-mirror {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 12px;
            height: 12px;
            background: radial-gradient(circle, 
                rgba(255, 215, 0, 1) 0%, 
                rgba(255, 215, 0, 0.8) 50%, 
                rgba(255, 215, 0, 0.3) 100%);
            border-radius: 50%;
            border: 1px solid rgba(255, 215, 0, 1);
            animation: center-pulse 2s ease-in-out infinite;
            box-shadow: 
                0 0 20px rgba(255, 215, 0, 0.8), 
                inset 0 0 6px rgba(255, 255, 255, 0.6);
        }

        /* 功能按钮区域 */
        .function-area {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 30px;
            z-index: 15;
            margin-top: 40px;
        }

        .function-btn {
            width: 280px;
            height: 80px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), rgba(173, 216, 230, 0.2));
            backdrop-filter: blur(20px);
            border: 2px solid rgba(173, 216, 230, 0.6);
            border-radius: 25px;
            color: rgba(255, 255, 255, 0.95);
            font-size: 1.4rem;
            font-weight: 600;
            font-family: 'Noto Serif SC', serif;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            text-shadow: 0 0 15px rgba(173, 216, 230, 0.7);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        .function-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.6s;
        }

        .function-btn:hover {
            transform: translateY(-8px) scale(1.05);
            border-color: rgba(255, 182, 193, 1);
            box-shadow: 0 15px 35px rgba(255, 182, 193, 0.4);
            background: linear-gradient(135deg, rgba(255, 182, 193, 0.25), rgba(173, 216, 230, 0.3));
        }

        .function-btn:hover::before {
            left: 100%;
        }

        .function-btn:active {
            transform: translateY(-4px) scale(1.02);
        }

        /* 登入按钮 */
        .btn-login {
            border-color: rgba(100, 255, 100, 0.7);
        }

        .btn-login:hover {
            border-color: rgba(100, 255, 100, 1);
            box-shadow: 0 15px 35px rgba(100, 255, 100, 0.4);
            background: linear-gradient(135deg, rgba(100, 255, 100, 0.25), rgba(144, 238, 144, 0.2));
        }

        /* 载入按钮 */
        .btn-load {
            border-color: rgba(173, 216, 230, 0.7);
        }

        .btn-load:hover {
            border-color: rgba(173, 216, 230, 1);
            box-shadow: 0 15px 35px rgba(173, 216, 230, 0.4);
            background: linear-gradient(135deg, rgba(173, 216, 230, 0.25), rgba(135, 206, 235, 0.2));
        }

        /* 图鉴按钮 */
        .btn-gallery {
            border-color: rgba(255, 182, 193, 0.7);
        }

        .btn-gallery:hover {
            border-color: rgba(255, 182, 193, 1);
            box-shadow: 0 15px 35px rgba(255, 182, 193, 0.4);
            background: linear-gradient(135deg, rgba(255, 182, 193, 0.25), rgba(255, 192, 203, 0.2));
        }

        /* 成就按钮 */
        .btn-achievement {
            border-color: rgba(255, 140, 0, 0.7);
        }

        .btn-achievement:hover {
            border-color: rgba(255, 140, 0, 1);
            box-shadow: 0 15px 35px rgba(255, 140, 0, 0.4);
            background: linear-gradient(135deg, rgba(255, 140, 0, 0.25), rgba(255, 165, 0, 0.2));
        }

        /* 设置按钮 */
        .btn-settings {
            border-color: rgba(147, 112, 219, 0.7);
        }

        .btn-settings:hover {
            border-color: rgba(147, 112, 219, 1);
            box-shadow: 0 15px 35px rgba(147, 112, 219, 0.4);
            background: linear-gradient(135deg, rgba(147, 112, 219, 0.25), rgba(138, 43, 226, 0.2));
        }

        /* 动画定义 */
        @keyframes title-glow {
            0%, 100% { text-shadow: 0 0 20px rgba(173, 216, 230, 0.5); }
            50% { text-shadow: 0 0 40px rgba(173, 216, 230, 0.8), 0 0 60px rgba(173, 216, 230, 0.6); }
        }

        @keyframes title-gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes shine {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        @keyframes subtitle-float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @keyframes area-pulse {
            0%, 100% { box-shadow: 0 0 40px rgba(173, 216, 230, 0.3); }
            50% { box-shadow: 0 0 80px rgba(173, 216, 230, 0.5); }
        }

        @keyframes rotate {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }

        @keyframes rotate-reverse {
            from { transform: translate(-50%, -50%) rotate(360deg); }
            to { transform: translate(-50%, -50%) rotate(0deg); }
        }

        @keyframes clock-rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes symbol-glow {
            0%, 100% { 
                color: rgba(173, 216, 230, 0.7); 
                text-shadow: 0 0 10px rgba(173, 216, 230, 0.4); 
                transform: scale(1);
            }
            50% { 
                color: rgba(255, 182, 193, 1); 
                text-shadow: 0 0 20px rgba(255, 182, 193, 0.6); 
                transform: scale(1.1);
            }
        }

        @keyframes center-pulse {
            0%, 100% { 
                transform: translate(-50%, -50%) scale(1); 
                box-shadow: 0 0 20px rgba(255, 215, 0, 0.8), inset 0 0 6px rgba(255, 255, 255, 0.6); 
            }
            50% { 
                transform: translate(-50%, -50%) scale(1.2); 
                box-shadow: 0 0 30px rgba(255, 215, 0, 1), inset 0 0 8px rgba(255, 255, 255, 0.8); 
            }
        }

        /* 音频控制按钮 */
        .audio-button {
            position: fixed;
            bottom: 20px;
            left: 20px;
            z-index: 1000;
        }

        .audio-toggle-btn {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(173, 216, 230, 0.6);
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            font-size: 1.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .audio-toggle-btn:hover {
            background: rgba(173, 216, 230, 0.3);
            transform: scale(1.1);
            box-shadow: 0 15px 35px rgba(173, 216, 230, 0.4);
        }

        .audio-toggle-btn.muted {
            background: rgba(255, 100, 100, 0.3);
            border-color: rgba(255, 100, 100, 0.6);
        }

        .audio-toggle-btn.muted:hover {
            background: rgba(255, 100, 100, 0.4);
            box-shadow: 0 15px 35px rgba(255, 100, 100, 0.4);
        }

        /* 响应式设计 */
        @media (max-width: 1200px) {
            .game-title { font-size: 3.5rem; }
            .game-subtitle { font-size: 1.5rem; }
            .wonderland-clock { width: 160px; height: 160px; }
            .function-area { gap: 25px; }
            .function-btn { width: 250px; height: 70px; font-size: 1.3rem; }
        }

        @media (max-width: 768px) {
            .game-title { font-size: 2.8rem; letter-spacing: 2px; }
            .game-subtitle { font-size: 1.2rem; }
            .wonderland-clock { width: 140px; height: 140px; bottom: 3%; right: 3%; }
            .function-area { gap: 22px; margin-top: 30px; }
            .function-btn { width: 220px; height: 65px; font-size: 1.2rem; }
            .wonderland-symbol { font-size: 1rem; }
        }

        @media (max-width: 480px) {
            .game-title { font-size: 2.2rem; }
            .game-subtitle { font-size: 1rem; }
            .function-area { gap: 20px; }
            .function-btn { width: 200px; height: 60px; font-size: 1.1rem; }
            .wonderland-clock { width: 120px; height: 120px; bottom: 2%; right: 2%; }
            .wonderland-symbol { font-size: 0.9rem; }
            .center-mirror { width: 10px; height: 10px; }
        }
    </style>
</head>
<body>
    <!-- 自定义光标 -->
    <div class="custom-cursor" id="customCursor"></div>

    <!-- 背景音乐 -->
    <audio id="backgroundMusic" loop>
        <source src="music/爱丽丝的梦境.mp3" type="audio/mpeg">
        您的浏览器不支持音频播放。
    </audio>

    <!-- 音频控制按钮 -->
    <div class="audio-button" id="audioButton">
        <button class="audio-toggle-btn" id="audioToggle">🔊</button>
    </div>

    <!-- 背景粒子画布 -->
    <canvas class="background-canvas" id="backgroundCanvas"></canvas>

    <!-- 主游戏容器 -->
    <div class="game-container">
        <!-- 游戏标题区域 -->
        <div class="title-section">
            <h1 class="game-title" data-text="奇域梦幻漫游录">奇域梦幻漫游录</h1>
            <p class="game-subtitle">— 跟随爱丽丝，坠入神秘的仙境世界 —</p>
        </div>

        <!-- 中央游戏区域 -->
        <div class="game-main-area">
            <!-- 仙境时钟 -->
            <div class="wonderland-clock">
                <div class="wonderland-symbol">♠</div>
                <div class="wonderland-symbol">♥</div>
                <div class="wonderland-symbol">♦</div>
                <div class="wonderland-symbol">♣</div>
                <div class="wonderland-symbol">♕</div>
                <div class="wonderland-symbol">♔</div>
                <div class="wonderland-symbol">🌹</div>
                <div class="wonderland-symbol">🎩</div>
            </div>
            
            <!-- 中央镜子 -->
            <div class="center-mirror"></div>
        </div>

        <!-- 功能按钮区域 -->
        <div class="function-area">
            <button class="function-btn btn-login" onclick="handleLogin()">
                🌟 登录
            </button>
            <button class="function-btn btn-load" onclick="handleLoad()">
                📁 探索
            </button>
            <button class="function-btn btn-gallery" onclick="handleGallery()">
                🃏 图鉴
            </button>
            <button class="function-btn btn-achievement" onclick="handleAchievement()">
                🏆 成就
            </button>
            <button class="function-btn btn-settings" onclick="handleSettings()">
                ⚙️ 设置
            </button>
        </div>
    </div>

    <!-- 右下角仙境时钟 -->
    <div class="wonderland-clock">
        <div class="wonderland-symbol">♠</div>
        <div class="wonderland-symbol">♥</div>
        <div class="wonderland-symbol">♦</div>
        <div class="wonderland-symbol">♣</div>
        <div class="wonderland-symbol">♕</div>
        <div class="wonderland-symbol">♔</div>
        <div class="wonderland-symbol">🌹</div>
        <div class="wonderland-symbol">🎩</div>
        
        <!-- 中央镜子 -->
        <div class="center-mirror"></div>
    </div>

    <script>
        // 自定义光标
        const cursor = document.getElementById('customCursor');
        let mouseX = 0, mouseY = 0;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            cursor.style.left = mouseX - 15 + 'px';
            cursor.style.top = mouseY - 15 + 'px';
        });

        // 鼠标悬停效果
        document.querySelectorAll('.function-btn').forEach(btn => {
            btn.addEventListener('mouseenter', () => {
                cursor.classList.add('hover');
            });
            
            btn.addEventListener('mouseleave', () => {
                cursor.classList.remove('hover');
            });
        });

        // 动态添加设置面板按钮的悬停效果
        document.addEventListener('mouseenter', (e) => {
            if (e.target.matches('.setting-btn, .settings-close, .setting-slider')) {
                cursor.classList.add('hover');
            }
        }, true);

        document.addEventListener('mouseleave', (e) => {
            if (e.target.matches('.setting-btn, .settings-close, .setting-slider')) {
                cursor.classList.remove('hover');
            }
        }, true);

        // 背景粒子系统
        const canvas = document.getElementById('backgroundCanvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 3 + 1;
                this.speedX = (Math.random() - 0.5) * 2;
                this.speedY = (Math.random() - 0.5) * 2;
                this.color = `rgba(${255}, ${215 + Math.random() * 40}, ${Math.random() * 100}, ${Math.random() * 0.5 + 0.2})`;
                this.life = Math.random() * 100 + 50;
                this.maxLife = this.life;
            }

            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.life--;

                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;

                if (this.life <= 0) {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.life = this.maxLife;
                }
            }

            draw() {
                ctx.save();
                const alpha = this.life / this.maxLife;
                ctx.globalAlpha = alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                
                // 添加发光效果
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        const particles = [];
        for (let i = 0; i < 100; i++) {
            particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });

            requestAnimationFrame(animate);
        }

        animate();

        // 窗口大小调整
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // 功能按钮事件处理
        function handleLogin() {
              // 检查是否已登录
              const token = localStorage.getItem('token');
              if (token) {
                  const user = JSON.parse(localStorage.getItem('user') || '{}');
                  showNotification(`✨ 欢迎回到仙境，${user.nickname || '神秘访客'}！`, 'success');
                  return;
              }
              
              // 跳转到登录页面
              showNotification('🌟 正在前往登录页面...', 'info');
              setTimeout(() => {
                  window.location.href = '/login';
              }, 400);
          }

        function handleLoad() {
            // 检查是否已登录
            const token = localStorage.getItem('token');

            if (token) {
                showNotification('📖 正在载入存档...', 'achievement');
                setTimeout(() => {
                    window.location.href = 'chapter/第一章节.html';
                }, 400);
            } else {
                showNotification('请先进行登录！', 'error');
                setTimeout(() => {
                    window.location.href = '/login';
                },400);
            }
        }

        // 解锁成就
        async function unlockAchievement(achievementId) {
            const achievement = achievementsData.find(a => a.id === achievementId);
            if (!achievement) {
                console.warn(`未找到成就: ${achievementId}`);
                return false;
            }

            if (achievement.unlocked) {
                console.log(`成就 ${achievement.name} 已经解锁过了`);
                return false;
            }

            const token = localStorage.getItem('token');
            
            if (token) {
                // 如果已登录，发送到服务器
                try {
                    const response = await fetch('/api/achievements/unlock', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({
                            achievementId: achievementId,
                            achievementName: achievement.name,
                            achievementDescription: achievement.description,
                            unlockedAt: new Date().toISOString()
                        })
                    });

                    if (response.ok) {
                        const result = await response.json();
                        if (result.success && result.newlyUnlocked) {
                            // 更新本地成就状态
                            achievement.unlocked = true;
                            achievement.unlockedAt = new Date().toLocaleDateString();
                            
                            // 显示成就解锁通知
                            showNotification(`🏆 成就解锁: ${achievement.name}`, 'achievement');
                            
                            console.log(`🏆 成就解锁: ${achievement.name}`);
                            return true;
                        }
                        return false;
                    } else {
                        throw new Error('服务器响应错误');
                    }
                } catch (error) {
                    console.error('成就解锁失败:', error);
                    // 服务器失败时，保存到本地作为备份
                }
            }

            // 如果未登录或服务器失败，保存到本地
            achievement.unlocked = true;
            achievement.unlockedAt = new Date().toLocaleDateString();
            
            // 显示成就解锁通知
            showNotification(`🏆 成就解锁: ${achievement.name}`, 'achievement');
            
            // 保存到localStorage作为备份
            localStorage.setItem('achievements', JSON.stringify(achievementsData));
            
            return true;
        }

        // 初始化成就数据
        async function initializeAchievements() {
            const token = localStorage.getItem('token');
            
            if (token) {
                // 如果已登录，从服务器获取成就数据
                try {
                    const response = await fetch('/api/achievements', {
                        headers: {
                            'Authorization': `Bearer ${token}`
                        }
                    });
                    
                    if (response.ok) {
                        const result = await response.json();
                        if (result.success && result.achievements) {
                            // 合并服务器成就数据
                            result.achievements.forEach(serverAchievement => {
                                const localAchievement = achievementsData.find(a => a.id === serverAchievement.name);
                                if (localAchievement) {
                                    localAchievement.unlocked = serverAchievement.unlocked;
                                    localAchievement.unlockedAt = serverAchievement.unlocked_at ? 
                                        new Date(serverAchievement.unlocked_at).toLocaleDateString() : 
                                        localAchievement.unlockedAt;
                                } else {
                                    // 如果本地没有这个成就，添加到列表中
                                    achievementsData.push({
                                        id: serverAchievement.name,
                                        name: serverAchievement.title,
                                        description: serverAchievement.description,
                                        icon: serverAchievement.icon || '🏆',
                                        backgroundImage: getBackgroundByRarity(serverAchievement.rarity),
                                        rarity: serverAchievement.rarity || 'common',
                                        unlocked: serverAchievement.unlocked,
                                        unlockedAt: serverAchievement.unlocked_at ? 
                                            new Date(serverAchievement.unlocked_at).toLocaleDateString() : 
                                            null
                                    });
                                }
                            });
                            
                            console.log('成就数据已从服务器同步');
                            return;
                        }
                    } else if (response.status === 401) {
                        // token过期，清除本地token
                        localStorage.removeItem('token');
                        localStorage.removeItem('user');
                    }
                } catch (error) {
                    console.error('获取服务器成就数据失败:', error);
                }
            }
            
            // 如果未登录或服务器获取失败，使用本地存储的成就数据
            const savedAchievements = localStorage.getItem('achievements');
            if (savedAchievements) {
                try {
                    const parsed = JSON.parse(savedAchievements);
                    // 合并保存的成就状态
                    parsed.forEach(saved => {
                        const achievement = achievementsData.find(a => a.id === saved.id);
                        if (achievement) {
                            achievement.unlocked = saved.unlocked;
                            achievement.unlockedAt = saved.unlockedAt;
                        }
                    });
                } catch (error) {
                    console.error('成就数据解析失败:', error);
                }
            }
        }

            const backgrounds = {
                'common': 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
                'uncommon': 'linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)',

                'epic': 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
                'legendary': 'linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%)'
            };
            return backgrounds[rarity] || backgrounds['common'];
        }

        // 退出登录
        async function logout(showMessage = true) {
            const token = localStorage.getItem('token');
            
            // 调用服务器端退出登录API
            if (token) {
                try {
                    await fetch('/api/logout', {
                        method: 'POST',

            // 统计成就数据
            const totalAchievements = achievementsData.length;
            const unlockedCount = achievementsData.filter(a => a.unlocked).length;
            const progressPercent = Math.round((unlockedCount / totalAchievements) * 100);

            modal.innerHTML = `

        // 生成成就卡片
        function generateAchievementCards() {
            return achievementsData.map(achievement => {
                const rarityClass = `rarity-${achievement.rarity}`;
                const unlockedClass = achievement.unlocked ? 'unlocked' : 'locked';
                const unlockedDate = achievement.unlocked ? 
                    `<div class="unlock-date">解锁于: ${achievement.unlockedAt}</div>` : 
                    '<div class="unlock-hint">完成条件以解锁</div>';

                return `
                    <div class="achievement-card ${rarityClass} ${unlockedClass}" data-rarity="${achievement.rarity}" data-unlocked="${achievement.unlocked}">
                        <div class="card-background" style="background: ${achievement.backgroundImage}"></div>
                        <div class="card-overlay"></div>
                        <div class="card-content">
                            <div class="achievement-icon">${achievement.icon}</div>
                            <div class="achievement-info">
                                <h3 class="achievement-name">${achievement.name}</h3>
                                <p class="achievement-desc">${achievement.description}</p>
                                ${unlockedDate}
                            </div>
                            <div class="rarity-badge">${getRarityText(achievement.rarity)}</div>
                            ${achievement.unlocked ? '<div class="unlock-check">✓</div>' : '<div class="lock-icon">🔒</div>'}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 获取稀有度文本
        function getRarityText(rarity) {
            const rarityMap = {
                'common': '普通',
                'uncommon': '优秀',
                'rare': '稀有',
                'epic': '史诗',
                'legendary': '传说'
            };
            return rarityMap[rarity] || '普通';
        }

        // 过滤成就
        function filterAchievements(filter) {
            // 更新按钮状态
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            // 过滤卡片
            const cards = document.querySelectorAll('.achievement-card');
            cards.forEach(card => {
                const isUnlocked = card.dataset.unlocked === 'true';
                const rarity = card.dataset.rarity;
                
                let show = false;
                
                switch(filter) {
                    case 'all':
                        show = true;
                        break;
                    case 'unlocked':
                        show = isUnlocked;
                        break;
                    case 'locked':
                        show = !isUnlocked;
                        break;
                    case 'rare':
                        show = ['rare', 'epic', 'legendary'].includes(rarity);
                        break;
                }
                
                if (show) {
                    card.style.display = 'block';
                    setTimeout(() => card.classList.add('show'), 10);
                } else {
                    card.classList.remove('show');
                    setTimeout(() => card.style.display = 'none', 300);
                }
            });
        }

        // 音频控制系统
        const audio = document.getElementById('backgroundMusic');
        const audioToggle = document.getElementById('audioToggle');

        // 音频状态管理
        let isAudioMuted = false;
        let savedVolume = 0.5;

        // 初始化音频设置
        function initializeAudio() {
            // 从localStorage加载音频设置
            const savedAudioSettings = localStorage.getItem('audioSettings');
            if (savedAudioSettings) {
                const settings = JSON.parse(savedAudioSettings);
                audio.volume = settings.volume || 0.5;
                isAudioMuted = settings.muted || false;
                savedVolume = settings.volume || 0.5;
            } else {
                audio.volume = 0.5;
            }

            // 更新音频按钮状态
            updateAudioToggleButton();
            
            // 尝试自动播放（需要用户交互）
            audio.addEventListener('canplaythrough', () => {
                if (!isAudioMuted) {
                    audio.play().catch(() => {
                        // 自动播放失败，等待用户交互
                        console.log('需要用户交互才能播放音频');
                    });
                }
            });
        }

        // 更新音频开关按钮
        function updateAudioToggleButton() {
            if (isAudioMuted || audio.paused) {
                audioToggle.textContent = '🔇';
                audioToggle.classList.add('muted');
            } else {
                audioToggle.textContent = '🔊';
                audioToggle.classList.remove('muted');
            }
        }

        // 切换音频播放/暂停
        function toggleAudio() {
            if (isAudioMuted) {
                // 取消静音
                isAudioMuted = false;
                audio.volume = savedVolume;
                audio.play().catch(() => {
                    console.log('播放失败');
                });
            } else if (audio.paused) {
                // 播放
                audio.play().catch(() => {
                    console.log('播放失败');
                });
            } else {
                // 暂停
                audio.pause();
            }
            updateAudioToggleButton();
            saveAudioSettings();
        }

        // 保存音频设置
        function saveAudioSettings() {
            const settings = {
                volume: savedVolume,
                muted: isAudioMuted
            };
            localStorage.setItem('audioSettings', JSON.stringify(settings));
        }

        // 音频控制事件监听
        audioToggle.addEventListener('click', toggleAudio);

        // 页面加载完成提示
        window.addEventListener('load', async () => {
            // 初始化音频系统

            // 初始化成就系统

                }
            }, 1000);
