    <script>
        // 游戏状态
        let gameState = {
            currentScene: 0,
            currentDialog: 0,
            autoMode: false,
            skipMode: false,
            isTransitioning: false,
            preloadedImages: new Map(),
            animationFrameId: null,
            aliceSize: 'normal', // 新增：记录爱丽丝当前体型状态
            typewriterSpeed: 50, // 打字机速度（毫秒）

        // 音频管理系统
        const audioManager = {
            currentMusic: null,
            isTransitioning: false,
            bgMusic: document.getElementById('bg-music'),
            defaultVolume: 0.6,
            audioEnabled: true, // 音频开关状态
            
            // 场景音频配置
            sceneMusic: {
                'opening': '../music/第二幕/1.房间.mp3',
                'eat_cake': '../music/第二幕/1.房间.mp3',

                'tears_pool': '../music/第二幕/2.泪水之池哭泣.mp3',
                'control_tears': '../music/第二幕/3.斗争成功1.mp3',
                'explore_tears_pool': '../music/第二幕/4.池下探索.mp3',
                'discover_hidden_space': '../music/第二幕/4.池下探索.mp3',
                'return_and_continue': '../music/第二幕/5.仙境的过去_拼图游戏.mp3',
                'continue_adventure': '../music/第二幕/6.门开后.mp3',
                'credits': '../music/第二幕/6.门开后.mp3'
            },
            
            // 初始化音频
            init() {
                this.bgMusic.volume = this.defaultVolume;
                this.bgMusic.addEventListener('ended', () => {
                    if (this.currentMusic) {
                        this.bgMusic.play().catch(e => console.log('音频播放失败:', e));
                    }
                });
                
                // 处理音频加载错误
                this.bgMusic.addEventListener('error', (e) => {
                    console.warn('音频加载错误:', e);
                });
                
                console.log('音频系统初始化完成');
            },
            
            // 播放指定音频
            async playMusic(musicPath, fadeIn = true) {
                // 检查音频开关状态
                if (!this.audioEnabled) {
                    console.log('音频已关闭，跳过播放');
                    return;
                }
                
                if (this.isTransitioning || this.currentMusic === musicPath) {
                    return;
                }
                
                console.log('切换音频到:', musicPath);
                this.isTransitioning = true;
                
                try {
                    // 如果有当前音乐，先淡出
                    if (this.currentMusic && !this.bgMusic.paused) {
                        await this.fadeOut();
                    }
                    
                    // 切换音频源
                    this.bgMusic.src = musicPath;
                    this.currentMusic = musicPath;
                    
                    // 重置音量并播放
                    this.bgMusic.volume = fadeIn ? 0 : this.defaultVolume;
                    
                    await this.bgMusic.play();
                    
                    // 淡入新音乐
                    if (fadeIn) {
                        await this.fadeIn();
                    }
                    
                    console.log('音频切换完成:', musicPath);
                } catch (error) {
                    console.warn('音频播放失败:', error);
                } finally {
                    this.isTransitioning = false;
                }
            },
            
            // 淡入效果
            fadeIn(duration = 1500) {
                return new Promise((resolve) => {
                    const startVolume = 0;
                    const endVolume = this.defaultVolume;
                    const steps = 30;
                    const stepTime = duration / steps;
                    const volumeStep = (endVolume - startVolume) / steps;
                    
                    let currentStep = 0;
                    this.bgMusic.volume = startVolume;
                    
                    const fadeInterval = setInterval(() => {
                        currentStep++;
                        const newVolume = startVolume + (volumeStep * currentStep);
                        
                        if (currentStep >= steps) {
                            this.bgMusic.volume = endVolume;
                            clearInterval(fadeInterval);
                            resolve();
                        } else {
                            this.bgMusic.volume = Math.min(newVolume, endVolume);
                        }
                    }, stepTime);
                });
            },
            
            // 淡出效果
            fadeOut(duration = 1000) {
                return new Promise((resolve) => {
                    const startVolume = this.bgMusic.volume;
                    const endVolume = 0;
                    const steps = 20;
                    const stepTime = duration / steps;
                    const volumeStep = (startVolume - endVolume) / steps;
                    
                    let currentStep = 0;
                    
                    const fadeInterval = setInterval(() => {
                        currentStep++;
                        const newVolume = startVolume - (volumeStep * currentStep);
                        
                        if (currentStep >= steps) {
                            this.bgMusic.volume = endVolume;
                            this.bgMusic.pause();
                            clearInterval(fadeInterval);
                            resolve();
                        } else {
                            this.bgMusic.volume = Math.max(newVolume, endVolume);
                        }
                    }, stepTime);
                });
            },
            
            // 停止音乐
            async stop(fadeOut = true) {
                if (fadeOut && !this.bgMusic.paused) {
                    await this.fadeOut();
                } else {
                    this.bgMusic.pause();
                    this.bgMusic.volume = 0;
                }
                this.currentMusic = null;
            },
            
            // 根据场景ID播放音乐
            playSceneMusic(sceneId) {
                const musicPath = this.sceneMusic[sceneId];
                if (musicPath) {
                    this.playMusic(musicPath);
                } else {
                    console.log('场景', sceneId, '没有配置音乐');
                }
            },
            
            // 切换音频开关状态
            toggleAudio() {
                this.audioEnabled = !this.audioEnabled;
                
                if (!this.audioEnabled && !this.bgMusic.paused) {
                    // 关闭音频时停止播放
                    this.stop(true);
                } else if (this.audioEnabled && this.currentMusic) {
                    // 开启音频时恢复播放当前场景音乐
                    this.playMusic(this.currentMusic);
                }
                
                // 更新按钮显示
                this.updateAudioButton();
            },
            
            // 更新音频按钮显示
            updateAudioButton() {
                if (this.audioEnabled) {
                    audioBtn.innerHTML = '🔊 音频';
                    audioBtn.title = '点击关闭音频';
                } else {
                    audioBtn.innerHTML = '🔇 静音';
                    audioBtn.title = '点击开启音频';
                }
            }
        };

        // 图片预加载管理器
        class ImagePreloader {
            constructor() {
                this.cache = new Map();
                this.loading = new Set();
            }

            async preload(src) {
                if (this.cache.has(src)) {
                    return this.cache.get(src);
                }

                if (this.loading.has(src)) {
                    return new Promise((resolve) => {
                        const checkLoad = () => {
                            if (this.cache.has(src)) {
                                resolve(this.cache.get(src));
                            } else {
                                setTimeout(checkLoad, 10);
                            }
                        };
                        checkLoad();
                    });
                }

                this.loading.add(src);
                
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.onload = () => {
                        this.cache.set(src, img);
                        this.loading.delete(src);
                        resolve(img);
                    };
                    img.onerror = () => {
                        this.loading.delete(src);
                        console.warn(`Failed to load image: ${src}`);
                        reject(new Error(`Failed to load image: ${src}`));
                    };
                    img.src = src;
                });
            }

            preloadBatch(sources) {
                return Promise.all(sources.map(src => this.preload(src).catch(err => {
                    console.warn(`Batch preload failed for ${src}:`, err);
                    return null;
                })));
            }
        }

                        fillStyle: 'transparent',
                        strokeStyle: 'transparent',
                        lineWidth: 0
                    },
                    plugin: {
                        attractors: [
                            function(bodyA, bodyB) {
                                return {
                                    x: (bodyA.position.x - bodyB.position.x) * config.attractionStrength,
                                    y: (bodyA.position.y - bodyB.position.y) * config.attractionStrength,
                                };
                            }
                        ]
                    }
                }
            );
            Matter.World.add(world, attractiveBody);

            addShapes();

            var mouse = Matter.Mouse.create(render.canvas);
            Matter.Events.on(engine, 'afterUpdate', function() {
                if (!mouse.position.x) return;
                Matter.Body.translate(attractiveBody, {
                    x: (mouse.position.x - attractiveBody.position.x) * 0.12,
                    y: (mouse.position.y - attractiveBody.position.y) * 0.12
                });
            });

            Matter.Runner.run(runner, engine);
            Matter.Render.run(render);

            // 👇 Interaction pression / rebond
            let isPressed = false;
            let pressStartTime = 0;
            const originalRadius = attractiveBody.circleRadius;

            render.canvas.addEventListener('mousedown', (event) => {
                isPressed = true;
                pressStartTime = Date.now();
                Matter.Body.scale(attractiveBody, 0.5, 0.5);
                
                // 在点击位置添加爆发效果
                createClickExplosion(event.clientX, event.clientY);
            });

            render.canvas.addEventListener('mouseup', () => {
                if (!isPressed) return;
                isPressed = false;

                const pressDuration = Date.now() - pressStartTime;
                const speedFactor = Math.min(2, Math.max(0.5, 1000 / pressDuration));

                anime({
                    targets: { radius: attractiveBody.circleRadius },
                    radius: originalRadius,
                    duration: 1000 / speedFactor,
                    easing: 'easeOutElastic',
                    update: function(anim) {
                        const current = attractiveBody.circleRadius;
                        const target = anim.animations[0].currentValue;
                        const scale = target / current;
                        Matter.Body.scale(attractiveBody, scale, scale);
                    }
                });
            });

            return { engine, runner, render };
        }

        function addShapes() {
            for (var i = 0; i < config.numShapes; i++) {
                let x = Matter.Common.random(0, render.options.width);
                let y = Matter.Common.random(0, render.options.height);
                let s = Matter.Common.random(config.minSize, config.maxSize);
                let sides = Math.floor(Matter.Common.random(config.minSides, config.maxSides + 1));

                var shape = Matter.Bodies.polygon(x, y, sides, s, {
                    mass: s / 20,
                    friction: 0,
                    frictionAir: config.frictionAir,
                    render: {
                        fillStyle: vibrantColors[Math.floor(Math.random() * vibrantColors.length)],
                        strokeStyle: '#fff',
                        lineWidth: 1
                    },
                    plugin: {
                        wrap: {
                            min: { x: 0, y: 0 },
                            max: { x: render.options.width, y: render.options.height }
                        }
                    }
                });

                Matter.World.add(world, shape);
            }
        }

        function createClickExplosion(x, y) {
            for (let i = 0; i < 8; i++) {
                let angle = (Math.PI * 2 * i) / 8;
                let distance = 20 + Math.random() * 30;
                let particleX = x + Math.cos(angle) * distance;
                let particleY = y + Math.sin(angle) * distance;
                
                let particle = Matter.Bodies.circle(particleX, particleY, 2 + Math.random() * 3, {
                    mass: 0.1,
                    friction: 0,
                    frictionAir: 0.08,
                    render: {
                        fillStyle: vibrantColors[Math.floor(Math.random() * vibrantColors.length)],
                        strokeStyle: '#fff',
                        lineWidth: 0.5
                    },
                    plugin: {
                        wrap: {
                            min: { x: 0, y: 0 },
                            max: { x: render.options.width, y: render.options.height }
                        }
                    }
                });
                
                // 给粒子一个初始速度
                let force = 0.002 + Math.random() * 0.003;
                Matter.Body.applyForce(particle, particle.position, {
                    x: Math.cos(angle) * force,
                    y: Math.sin(angle) * force
                });
                
                Matter.World.add(world, particle);
                
                // 3秒后移除粒子
                setTimeout(() => {
                    Matter.World.remove(world, particle);
                }, 3000);
            }
        }

        function debounce(func, wait, immediate) {
            var timeout;
            return function() {
                var context = this, args = arguments;
                var later = function() {
                    timeout = null;
                    if (!immediate) func.apply(context, args);
                };
                var callNow = immediate && !timeout;
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
                if (callNow) func.apply(context, args);
            };
        }

        // 打字机效果函数
        function typewriterEffect(element, text, speed = gameState.typewriterSpeed) {
            return new Promise((resolve) => {
                // 清除之前的内容和定时器
                if (gameState.typewriterTimeout) {
                    clearTimeout(gameState.typewriterTimeout);
                }
                
                element.innerHTML = '';
                element.classList.add('typewriter-text');
                gameState.isTyping = true;
                
                let charIndex = 0;
                const chars = text.split('');
                
                // 添加光标
                const cursor = document.createElement('span');
                cursor.className = 'typewriter-cursor';
                element.appendChild(cursor);
                
                function typeNextChar() {
                    if (charIndex < chars.length && gameState.isTyping) {
                        const char = chars[charIndex];
                        const span = document.createElement('span');
                        span.textContent = char;
                        span.className = 'char-appear';
                        
                        // 在光标前插入字符
                        element.insertBefore(span, cursor);
                        charIndex++;
                        
                        gameState.typewriterTimeout = setTimeout(typeNextChar, speed);
                    } else {
                        // 打字完成，移除光标
                        if (cursor.parentNode) {
                            cursor.remove();
                        }
                        gameState.isTyping = false;
                        element.classList.remove('typewriter-text');
                        resolve();
                    }
                }
                
                // 开始打字
                gameState.typewriterTimeout = setTimeout(typeNextChar, speed);
            });
        }

        // 跳过打字机效果
        function skipTypewriter() {
            if (gameState.isTyping && gameState.typewriterTimeout) {
                clearTimeout(gameState.typewriterTimeout);
                gameState.isTyping = false;
                
                // 立即显示完整文本
                const scene = gameData.scenes[gameState.currentScene];
                const dialog = scene.dialogs[gameState.currentDialog];
                if (dialog) {
                    dialogText.innerHTML = dialog.text || '';
                    dialogText.classList.remove('typewriter-text');
                    // 移除可能存在的光标
                    const cursor = dialogText.querySelector('.typewriter-cursor');
                    if (cursor) cursor.remove();
                }
            }
        }

        // 防抖函数
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        // 节流函数
        function throttle(func, limit) {
            let inThrottle;
            return function(...args) {
                if (!inThrottle) {
                    func.apply(this, args);
                    inThrottle = true;
                    setTimeout(() => inThrottle = false, limit);
                }
            };
        }

        // 加载场景
        async function loadScene(sceneIndex) {
            if (gameState.isTransitioning) return;
            gameState.isTransitioning = true;

            try {
                gameState.currentScene = sceneIndex;
                gameState.currentDialog = 0;
                
                const scene = gameData.scenes[sceneIndex];
                if (!scene) {
                    throw new Error(`Scene ${sceneIndex} not found`);
                }
                
                // 播放场景音乐
                audioManager.playSceneMusic(scene.id);
                
                // 预加载背景图片
                await imagePreloader.preload(scene.background);
                
                // 设置背景
                background.style.backgroundImage = `url(${scene.background})`;
                background.style.opacity = '1';
                
                // 显示对话框
                await new Promise(resolve => {
                    setTimeout(() => {
                        dialogBox.classList.add('show');
                        showDialog();
                        resolve();
                    }, 300);
                });
            } catch (error) {
                console.error('Failed to load scene:', error);
                alert('场景加载失败，请重试');
            } finally {
                gameState.isTransitioning = false;
            }
        }

        // 显示对话（带打字机效果）
        function showDialog() {
            try {
                const scene = gameData.scenes[gameState.currentScene];
                const dialog = scene.dialogs[gameState.currentDialog];
                
                if (!dialog) {
                    console.log('对话结束');
                    return;
                }

                // 取消之前的动画帧和打字机效果
                if (gameState.animationFrameId) {
                    cancelAnimationFrame(gameState.animationFrameId);
                }
                if (gameState.typewriterTimeout) {
                    clearTimeout(gameState.typewriterTimeout);
                }

                // 使用requestAnimationFrame优化动画
                gameState.animationFrameId = requestAnimationFrame(() => {
                    // 淡出当前内容
                    dialogText.style.opacity = '0';
                    characterName.style.opacity = '0';
                    
                    setTimeout(async () => {
                        // 设置角色名称
                        characterName.textContent = dialog.character || '';
                        
                        // 淡入角色名称
                        requestAnimationFrame(() => {
                            characterName.style.opacity = '1';
                        });
                        
                        // 显示角色立绘
                        showCharacters(dialog.characters || []);
                        
                        // 等待一下再开始打字效果
                        setTimeout(async () => {
                            dialogText.style.opacity = '1';
                            
                            // 使用打字机效果显示对话文本
                            if (dialog.text) {
                                await typewriterEffect(dialogText, dialog.text);
                            }
                            
                            // 处理成就解锁
                            if (dialog.achievement) {
                                setTimeout(() => {
                                    if (window.achievementSystem) {
                                        window.achievementSystem.unlockAchievement(dialog.achievement);
                                    }
                                }, 1000);
                            }

                            // 处理选择按钮（修复版） - 确保在打字完成后执行
                            if (dialog.choices && dialog.choices.length > 0) {
                                console.log('对话有选择项，准备显示:', dialog.choices);
                                setTimeout(() => showChoices(dialog.choices), 500);
                            } else {
                                console.log('对话无选择项，隐藏选择按钮');
                                hideChoices();
                            }
                        }, 300);
                    }, 200);
                });
            } catch (error) {
                console.error('Failed to show dialog:', error);
                setTimeout(() => showDialog(), 1000);
            }
        }



        // 显示角色立绘
        async function showCharacters(characters) {
            try {
                // 清除所有角色的特效类
                [characterLeft, characterCenter, characterRight].forEach(char => {
                    char.classList.remove('show', 'growing', 'shrinking');
                    char.style.opacity = '0';
                });
                
                if (!characters || characters.length === 0) return;
                
                await new Promise(resolve => setTimeout(resolve, 300));
                
                const showPromises = characters.map(async (char, index) => {
                    const element = getCharacterElement(char.position);
                    if (!element || !char.image) return;
                    
                    try {
                        await imagePreloader.preload(char.image);
                        
                        element.src = char.image;
                        element.alt = char.name || '';
                        
                        // 根据爱丽丝当前体型状态应用特效
                        if (char.name === '爱丽丝') {
                            if (gameState.aliceSize === 'large') {
                                // 延迟应用变大特效，让过渡效果更明显
                                setTimeout(() => {
                                    element.classList.add('growing');
                                    console.log('应用变大特效');
                                }, 100);
                            } else if (gameState.aliceSize === 'small') {
                                // 延迟应用变小特效，让过渡效果更明显
                                setTimeout(() => {
                                    element.classList.add('shrinking');
                                    console.log('应用变小特效');
                                }, 100);
                            } else {
                                console.log('爱丽丝正常体型');
                            }
                        } else if (char.effect) {
                            // 非爱丽丝角色保持原有特效
                            element.classList.add(char.effect);
                        }
                        
                        setTimeout(() => {
                            requestAnimationFrame(() => {
                                element.classList.add('show');
                                element.style.opacity = '1';
                            });
                        }, index * 200);
                    } catch (error) {
                        console.warn(`Failed to load character image: ${char.image}`, error);
                    }
                });
                
                await Promise.all(showPromises);
            } catch (error) {
                console.error('Failed to show characters:', error);
            }
        }

        // 获取角色元素

        // 显示选择按钮（修复版）
        function showChoices(choiceList) {
            if (!choiceList || choiceList.length === 0) {
                console.log('没有选择项可显示');
                return;
            }
            
            console.log('正在显示选择项:', choiceList.length, '个选择');
            
            // 强制确保容器状态正确
            choices.style.display = 'flex';
            choices.style.opacity = '0';
            choices.innerHTML = '';
            choices.style.visibility = 'visible';
            
            // 先创建所有按钮
            const buttons = [];
            choiceList.forEach((choice, index) => {
                const btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.textContent = choice.text || '';
                btn.style.transform = 'translateY(50px)';
                btn.style.opacity = '0';
                
                const debouncedClick = debounce(async (e) => {
                    if (gameState.isTransitioning) return;
                    
                    e.preventDefault();
                    e.stopPropagation();
                    
                    choices.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);
                    
                    // 创建波纹效果
                    const ripple = document.createElement('div');
                    ripple.className = 'choice-ripple';
                    
                    const rect = btn.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    
                    const size = Math.max(rect.width, rect.height);
                    ripple.style.width = `${size}px`;
                    ripple.style.height = `${size}px`;
                    ripple.style.left = `${x - size / 2}px`;
                    ripple.style.top = `${y - size / 2}px`;
                    
                    btn.appendChild(ripple);
                    
                    setTimeout(() => {
                        makeChoice(choice);
                        if (ripple.parentNode) {
                            ripple.remove();
                        }
                    }, 300);
                }, 300);
                
                btn.addEventListener('click', debouncedClick);
                buttons.push(btn);
                choices.appendChild(btn);
            });
            
            console.log('已创建按钮数量:', buttons.length);
            console.log('容器内按钮数量:', choices.querySelectorAll('.choice-btn').length);
            
            // 强制重排，确保DOM更新
            choices.offsetHeight;
            
            // 立即显示容器，然后动画显示按钮
            requestAnimationFrame(() => {
                choices.style.opacity = '1';
                console.log('容器已设置为可见');
                
                // 延迟显示按钮动画
                setTimeout(() => {
                    buttons.forEach((btn, index) => {
                        setTimeout(() => {
                            requestAnimationFrame(() => {
                                btn.style.transform = 'translateY(0)';
                                btn.style.opacity = '1';
                                console.log(`按钮 ${index + 1} 已显示`);
                            });
                        }, index * 150);
                    });
                }, 50);
            });
        }

        // 做出选择
        function makeChoice(choice) {
            if (gameState.isTransitioning || !choice) return;
            
            try {
                // 根据选择更新爱丽丝体型状态
                if (choice.text && choice.text.includes('吃掉')) {
                    updateAliceSize('large');
                } else if (choice.text && choice.text.includes('喝下')) {
                    updateAliceSize('small');
                }
                
                hideChoices();
                
                if (choice.nextScene) {
                    // 检查是否是外部HTML文件（支持带参数的URL）
                    if (choice.nextScene.includes('.html')) {
                        // 跳转到外部HTML文件
                        setTimeout(() => {
                            window.location.href = choice.nextScene;
                        }, 500);
                    } else {
                        // 内部场景跳转
                        const nextSceneIndex = gameData.scenes.findIndex(scene => scene.id === choice.nextScene);
                        if (nextSceneIndex !== -1) {
                            setTimeout(() => loadScene(nextSceneIndex), 500);
                        } else {
                            console.error(`Scene not found: ${choice.nextScene}`);
                        }
                    }
                } else {
                    setTimeout(() => nextDialog(), 300);
                }
            } catch (error) {
                console.error('Failed to make choice:', error);
                gameState.isTransitioning = false;
            }
        }

                if (gameState.currentDialog >= scene.dialogs.length) {

                console.error('Failed to show next dialog:', error);
            }
        }

            console.log('当前对话索引:', gameState.currentDialog);
            console.log('当前场景:', gameState.currentScene);
            console.log('爱丽丝体型状态:', gameState.aliceSize);
            
            const scene = gameData.scenes[gameState.currentScene];
            const dialog = scene?.dialogs[gameState.currentDialog];
            if (dialog) {
                console.log('当前对话有选择:', dialog.choices?.length || 0);
                console.log('选择内容:', dialog.choices);
            }
            console.log('=============================');
        }

        // 在控制台暴露调试函数
        window.debugChoices = debugChoicesState;























        // 初始化选择按钮容器（增强版）
        function initChoicesContainer() {
            choices.style.opacity = '0';
            choices.style.display = 'flex';
            choices.style.visibility = 'visible';
            choices.style.pointerEvents = 'auto';
            choices.innerHTML = '';
            
            // 强制重排，确保样式应用
            choices.offsetHeight;
            
            console.log('选择按钮容器已初始化');
            console.log('容器状态 - opacity:', choices.style.opacity, 'display:', choices.style.display);
        }

        // 事件监听
        startBtn.addEventListener('click', () => {
            // 重置游戏状态
            gameState = {
                currentScene: 0,
                currentDialog: 0,
                autoMode: false,
                skipMode: false,
                isTransitioning: false,
                preloadedImages: new Map(),
                animationFrameId: null,
                aliceSize: 'normal', // 重置爱丽丝体型状态
                typewriterSpeed: 50, // 打字机速度（毫秒）
                isTyping: false, // 是否正在打字
                typewriterTimeout: null // 打字机定时器
            };
            
            // 尝试播放音频（需要用户交互后才能播放）
            audioManager.bgMusic.play().catch(e => {
                console.log('音频播放需要用户交互，将在场景加载时重试');
            });
            
            // 重新初始化音频按钮显示
            audioManager.updateAudioButton();
            
            // 重新初始化选择按钮容器
            initChoicesContainer();
            
            initGame();
        });
        


        // 页面加载时检查是否从隐藏关卡返回
        window.addEventListener('load', () => {
            // 初始化选择按钮容器
            initChoicesContainer();
            
            // 初始化音频按钮显示
            if (audioManager && audioManager.updateAudioButton) {
                audioManager.updateAudioButton();
            }
            
            // 初始化点击特效系统
            try {
                let m = createWorld();
                setWindowSize();
                $(window).resize(debounce(setWindowSize, 250));
                clickEffectSystem = m; // 保存引用以便后续清理
            } catch (error) {
                console.warn('点击特效系统初始化失败:', error);
            }
            
            const hasLocalStorageFlag = localStorage.getItem('alice_return_from_hidden') === 'true';
            const hasUrlParam = new URLSearchParams(window.location.search).get('return_from_hidden') === 'true';
            
            if (hasLocalStorageFlag || hasUrlParam) {
                // 如果是从隐藏关卡返回，直接初始化游戏
                initGame();
            }
        });

        // 页面卸载时清理资源
        window.addEventListener('beforeunload', () => {
            if (clickEffectSystem) {
                cleanupEffectSystem();
            }
        });
        
        // 点击页面任意位置继续对话（优化版 + 打字机支持）
        document.addEventListener('click', debounce((e) => {
            // 检查点击的元素是否应该被忽略
            const clickedElement = e.target;
            const excludeSelectors = [
                '.choice-btn',           // 选择按钮
                '.control-btn',          // 控制按钮
                '#start-btn',            // 开始按钮
                '.dg',                   // GUI控制面板
                '.dg *'                  // GUI控制面板内的所有元素
            ];
            
            // 检查是否点击了需要排除的元素
            const shouldExclude = excludeSelectors.some(selector => {
                if (selector.includes('*')) {
                    // 处理通配符选择器
                    const baseSelector = selector.replace(' *', '');
                    return clickedElement.closest(baseSelector);
                }
                return clickedElement.matches(selector) || clickedElement.closest(selector);
            });
            
            // 检查是否在标题界面
            const titleScreen = document.getElementById('title-screen');
            const isOnTitleScreen = titleScreen && titleScreen.style.display !== 'none';
            
            // 如果在标题界面或点击了排除的元素，则不执行对话继续逻辑
            if (isOnTitleScreen || shouldExclude) {
                return;
            }
            
            // 执行对话继续逻辑
            if (!gameState.autoMode && !gameState.skipMode && !gameState.isTransitioning) {
                // 如果正在打字，点击跳过打字机效果
                if (gameState.isTyping) {
                    skipTypewriter();
                } else {
                    // 否则继续下一段对话
                    nextDialog();
                }
            }
        }, 100));

        autoBtn.addEventListener('click', debounce(() => {
            gameState.autoMode = !gameState.autoMode;
            autoBtn.textContent = gameState.autoMode ? '手动' : '自动';
        }, 300));

        skipBtn.addEventListener('click', debounce(() => {
            gameState.skipMode = !gameState.skipMode;
            skipBtn.textContent = gameState.skipMode ? '正常' : '快进';
        }, 300));

        audioBtn.addEventListener('click', debounce(() => {
            audioManager.toggleAudio();
        }, 300));





        // 键盘快捷键
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case ' ': // 空格键继续
                    e.preventDefault();
                    nextDialog();
                    break;
                case 'Enter': // 回车键继续
                    e.preventDefault();
                    nextDialog();
                    break;
                case 'c': // C键强制显示选择（调试用）
                case 'C':
                    e.preventDefault();
                    const scene = gameData.scenes[gameState.currentScene];
                    const dialog = scene?.dialogs[gameState.currentDialog];
                    if (dialog?.choices && dialog.choices.length > 0) {
                        console.log('手动触发选择显示');
                        // 强制重新初始化容器
                        initChoicesContainer();
                        setTimeout(() => showChoices(dialog.choices), 100);
                    } else {
                        console.log('当前对话没有选择项');
                    }
                    break;
                case 'd': // D键调试信息
                case 'D':
                    e.preventDefault();
                    debugChoicesState();
                    break;
            }
        });



        // 自动模式
        setInterval(() => {
            if (gameState.autoMode) {
                const scene = gameData.scenes[gameState.currentScene];
                const dialog = scene.dialogs[gameState.currentDialog];
                
                if (dialog && (!dialog.choices || dialog.choices.length === 0)) {
                    setTimeout(nextDialog, 3000);
                }
            }
        }, 1000);


    </script>
</body>
</html>
