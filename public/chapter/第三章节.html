    <script>
        // 音频管理系统
        const audioManager = {
            currentMusic: null,
            isTransitioning: false,
            bgMusic: document.getElementById('bg-music'),
            defaultVolume: 0.6,
            audioEnabled: true,
            
            // 场景音频配置
            sceneMusic: {
                'opening': '../music/第三幕/1黑幕独白.mp3',
                'self_reflection': '../music/第三幕/1黑幕独白.mp3',
                'garden': '../music/第三幕/2.花园.mp3',
                'color_game': '../music/第三幕/3.柴郡猫的问答.mp3',
                'color_result': '../music/第三幕/3.柴郡猫的问答.mp3',
                'embrace_chaos': '../music/第三幕/4.心灵共鸣游戏.mp3',
                'embrace_chaos_success': '../music/第三幕/4.心灵共鸣游戏.mp3',
                'use_power': '../music/第三幕/5.卡牌游戏.mp3',
                'use_power_success': '../music/第三幕/5.卡牌游戏.mp3',
                'tea_party_transition': '../music/第三幕/6.茶话会衔接_过关后.mp3',
                'vortex_transition': '../music/第三幕/6.茶话会衔接_过关后.mp3'
            },
            
            // 初始化音频
            init() {
                this.bgMusic.volume = this.defaultVolume;
                this.bgMusic.addEventListener('ended', () => {
                    if (this.currentMusic) {
                        this.bgMusic.play().catch(e => console.log('音频播放失败:', e));
                    }
                });
                
                // 处理音频加载错误
                this.bgMusic.addEventListener('error', (e) => {
                    console.warn('音频加载错误:', e);
                });
                
                console.log('第三章音频系统初始化完成');
            },
            
            // 播放指定音频
            async playMusic(musicPath, fadeIn = true) {
                // 检查音频开关状态
                if (!this.audioEnabled) {
                    console.log('音频已关闭，跳过播放');
                    return;
                }
                
                if (this.isTransitioning || this.currentMusic === musicPath) {
                    return;
                }
                
                console.log('切换音频到:', musicPath);
                this.isTransitioning = true;
                
                try {
                    // 如果有当前音乐，先淡出
                    if (this.currentMusic && !this.bgMusic.paused) {
                        await this.fadeOut();
                    }
                    
                    // 切换音频源
                    this.bgMusic.src = musicPath;
                    this.currentMusic = musicPath;
                    
                    // 重置音量并播放
                    this.bgMusic.volume = fadeIn ? 0 : this.defaultVolume;
                    
                    await this.bgMusic.play();
                    
                    // 淡入新音乐
                    if (fadeIn) {
                        await this.fadeIn();
                    }
                    
                    console.log('音频切换完成:', musicPath);
                } catch (error) {
                    console.warn('音频播放失败:', error);
                } finally {
                    this.isTransitioning = false;
                }
            },
            
            // 淡入效果
            fadeIn(duration = 1500) {
                return new Promise((resolve) => {
                    const startVolume = 0;
                    const endVolume = this.defaultVolume;
                    const steps = 30;
                    const stepTime = duration / steps;
                    const volumeStep = (endVolume - startVolume) / steps;
                    
                    let currentStep = 0;
                    this.bgMusic.volume = startVolume;
                    
                    const fadeInterval = setInterval(() => {
                        currentStep++;
                        const newVolume = startVolume + (volumeStep * currentStep);
                        
                        if (currentStep >= steps) {
                            this.bgMusic.volume = endVolume;
                            clearInterval(fadeInterval);
                            resolve();
                        } else {
                            this.bgMusic.volume = Math.min(newVolume, endVolume);
                        }
                    }, stepTime);
                });
            },
            
            // 淡出效果
            fadeOut(duration = 1000) {
                return new Promise((resolve) => {
                    const startVolume = this.bgMusic.volume;
                    const endVolume = 0;
                    const steps = 20;
                    const stepTime = duration / steps;
                    const volumeStep = (startVolume - endVolume) / steps;
                    
                    let currentStep = 0;
                    
                    const fadeInterval = setInterval(() => {
                        currentStep++;
                        const newVolume = startVolume - (volumeStep * currentStep);
                        
                        if (currentStep >= steps) {
                            this.bgMusic.volume = endVolume;
                            this.bgMusic.pause();
                            clearInterval(fadeInterval);
                            resolve();
                        } else {
                            this.bgMusic.volume = Math.max(newVolume, endVolume);
                        }
                    }, stepTime);
                });
            },
            
            // 停止音乐
            async stop(fadeOut = true) {
                if (fadeOut && !this.bgMusic.paused) {
                    await this.fadeOut();
                } else {
                    this.bgMusic.pause();
                    this.bgMusic.volume = 0;
                }
                this.currentMusic = null;
            },
            
            // 根据场景ID播放音乐
            playSceneMusic(sceneId) {
                const musicPath = this.sceneMusic[sceneId];
                if (musicPath) {
                    this.playMusic(musicPath);
                } else {
                    console.log('场景', sceneId, '没有配置音乐');
                }
            },
            
            // 切换音频开关状态
            toggleAudio() {
                this.audioEnabled = !this.audioEnabled;
                
                if (!this.audioEnabled && !this.bgMusic.paused) {
                    // 关闭音频时停止播放
                    this.stop(true);
                } else if (this.audioEnabled && this.currentMusic) {
                    // 开启音频时恢复播放当前场景音乐
                    this.playMusic(this.currentMusic);
                }
                
                // 更新按钮显示
                this.updateAudioButton();
            },
            
            // 更新音频按钮显示
            updateAudioButton() {
                const audioBtn = document.getElementById('audio-btn');
                if (this.audioEnabled) {
                    audioBtn.innerHTML = '🔊 音频';
                    audioBtn.title = '点击关闭音频';
                } else {
                    audioBtn.innerHTML = '🔇 静音';
                    audioBtn.title = '点击开启音频';
                }
            }
        };

        let gameState = {
            currentScene: 0,
            currentDialog: 0,
            autoMode: false,
            skipMode: false,
            isTransitioning: false,
            preloadedImages: new Map(),
            animationFrameId: null,
            playerChoices: {
                colorGame: null,
                finalChoice: null
            },
            typewriterSpeed: 50, // 打字机速度（毫秒）
            isTyping: false, // 是否正在打字
            typewriterTimeout: null // 打字机定时器
        };

        const gameData = {
            scenes: [
                {
                    id: "opening",
                    background: "./img/小门.png",
                    dialogs: [
                        {
                            character: "旁白",
                            text: "爱丽丝穿过小门，踏入了真正的仙境。第二幕的奇遇，让她不再满足于仅仅回家的念头。她意识到，除非真正理解这个世界的逻辑，否则永远无法找到真正的出路。",
                            characters: [],
                            choices: []
                        },
                        {
                            character: "旁白",
                            text: "她的目标变了，变得有点不一样：她想试着理解仙境的规矩，也许就能找到一个让她和这些奇怪事儿好好相处的方法。",
                            characters: [],
                            choices: [
                                { text: "勇敢面对内心的困惑，深入思考", nextScene: "self_reflection" }
                            ]
                        }
                    ]
                },
                {
                    id: "self_reflection",
                    background: "./img/小门.png",
                    dialogs: [
                        {
                            character: "爱丽丝",
                            text: "这里的一切都跟我以前知道的不一样，就像现实里那些我搞不懂却又必须照做的规矩，让我觉得特别别扭。如果我无法理解这地方的古怪，我又怎么能真正看清我自己呢？",
                            characters: [
                                { position: "left", image: "./img/人物素材/1111人物/困惑.png", name: "爱丽丝" }
                            ],
                            choices: []
                        },
                        {
                            character: "爱丽丝",
                            text: "也许，回家不仅仅是离开这里，更是要在这里找到我内心的答案。",
                            characters: [
                                { position: "left", image: "./img/人物素材/1111人物/坚定.png", name: "爱丽丝" }
                            ],
                            choices: []
                        },
                        {
                            character: "旁白",
                            text: "爱丽丝的这份改变，是她自我认知深化的标志。她明白，理解仙境，就是理解自己；反之亦然。这与她先前获得的【无畏之核】息息相关，那份无畏让她不再逃避内心的困惑。",
                            characters: [],
                            choices: [
                                { text: "继续前进", nextScene: "garden" }
                            ]
                        }
                    ]
                },
                {
                    id: "garden",
                    background: "./img/花园.png",
                    dialogs: [
                        {
                            character: "旁白",

        class ImagePreloader {
            constructor() {
                this.cache = new Map();
                this.loading = new Set();
            }

            async preload(src) {
                if (this.cache.has(src)) {
                    return this.cache.get(src);
                }

                if (this.loading.has(src)) {
                    return new Promise((resolve) => {
                        const checkLoad = () => {
                            if (this.cache.has(src)) {
                                resolve(this.cache.get(src));
                            } else {
                                setTimeout(checkLoad, 10);
                            }
                        };
                        checkLoad();
                    });
                }

                this.loading.add(src);
                
                return new Promise((resolve, reject) => {
                    const img = new Image();
                    img.onload = () => {
                        this.cache.set(src, img);
                        this.loading.delete(src);
                        resolve(img);
                    };
                    img.onerror = () => {
                        this.loading.delete(src);
                        console.warn(`Failed to load image: ${src}`);
                        reject(new Error(`Failed to load image: ${src}`));
                    };
                    img.src = src;
                });
            }

            preloadBatch(sources) {
                return Promise.all(sources.map(src => this.preload(src).catch(err => {
                    console.warn(`Batch preload failed for ${src}:`, err);
                    return null;
                })));
            }
        }

        var engine, runner, render, world, attractiveBody;

        function createWorld() {
            engine = Matter.Engine.create();
            engine.world.gravity.scale = 0;

            render = Matter.Render.create({
                element: canvas,
                engine: engine,
                options: {
                    width: dimensions.width,
                    height: dimensions.height,
                    wireframes: false,
                    background: 'transparent'
                }
            });

            runner = Matter.Runner.create();
            world = engine.world;

            attractiveBody = Matter.Bodies.circle(
                render.options.width / 2,
                render.options.height / 2,
                Math.min(dimensions.width, dimensions.height) / 36,
                {
                    isStatic: true,
                    render: {
                        fillStyle: 'transparent',
                        strokeStyle: 'transparent',
                        lineWidth: 0
                    },
                    plugin: {
                        attractors: [
                            function(bodyA, bodyB) {
                                return {
                                    x: (bodyA.position.x - bodyB.position.x) * config.attractionStrength,
                                    y: (bodyA.position.y - bodyB.position.y) * config.attractionStrength,
                                };
                            }
                        ]
                    }
                }
            );
            Matter.World.add(world, attractiveBody);

            addShapes();

            var mouse = Matter.Mouse.create(render.canvas);
            Matter.Events.on(engine, 'afterUpdate', function() {
                if (!mouse.position.x) return;
                Matter.Body.translate(attractiveBody, {
                    x: (mouse.position.x - attractiveBody.position.x) * 0.12,
                    y: (mouse.position.y - attractiveBody.position.y) * 0.12
                });
            });

            Matter.Runner.run(runner, engine);
            Matter.Render.run(render);

            // 👇 Interaction pression / rebond
            let isPressed = false;
            let pressStartTime = 0;
            const originalRadius = attractiveBody.circleRadius;

            render.canvas.addEventListener('mousedown', (event) => {
                isPressed = true;
                pressStartTime = Date.now();
                Matter.Body.scale(attractiveBody, 0.5, 0.5);
                
                // 在点击位置添加爆发效果
                createClickExplosion(event.clientX, event.clientY);
            });

            render.canvas.addEventListener('mouseup', () => {
                if (!isPressed) return;
                isPressed = false;

                const pressDuration = Date.now() - pressStartTime;
                const speedFactor = Math.min(2, Math.max(0.5, 1000 / pressDuration));

                anime({
                    targets: { radius: attractiveBody.circleRadius },
                    radius: originalRadius,
                    duration: 1000 / speedFactor,
                    easing: 'easeOutElastic',
                    update: function(anim) {
                        const current = attractiveBody.circleRadius;
                        const target = anim.animations[0].currentValue;
                        const scale = target / current;
                        Matter.Body.scale(attractiveBody, scale, scale);
                    }
                });
            });

            return { engine, runner, render };
        }

        function addShapes() {
            for (var i = 0; i < config.numShapes; i++) {
                let x = Matter.Common.random(0, render.options.width);
                let y = Matter.Common.random(0, render.options.height);
                let s = Matter.Common.random(config.minSize, config.maxSize);
                let sides = Math.floor(Matter.Common.random(config.minSides, config.maxSides + 1));

                var shape = Matter.Bodies.polygon(x, y, sides, s, {
                    mass: s / 20,
                    friction: 0,
                    frictionAir: config.frictionAir,
                    render: {
                        fillStyle: vibrantColors[Math.floor(Math.random() * vibrantColors.length)],
                        strokeStyle: '#fff',
                        lineWidth: 1
                    },
                    plugin: {
                        wrap: {
                            min: { x: 0, y: 0 },
                            max: { x: render.options.width, y: render.options.height }
                        }
                    }
                });

                Matter.World.add(world, shape);
            }
        }

        function resetWorld() {
            Matter.World.clear(world, false);
            Matter.Engine.clear(engine);
            Matter.World.add(world, attractiveBody);
            addShapes();
        }

        function createClickExplosion(x, y) {
            for (let i = 0; i < 8; i++) {
                let angle = (Math.PI * 2 * i) / 8;
                let distance = 20 + Math.random() * 30;
                let particleX = x + Math.cos(angle) * distance;
                let particleY = y + Math.sin(angle) * distance;
                
                let particle = Matter.Bodies.circle(particleX, particleY, 2 + Math.random() * 3, {
                    mass: 0.1,
                    friction: 0,
                    frictionAir: 0.08,
                    render: {
                        fillStyle: vibrantColors[Math.floor(Math.random() * vibrantColors.length)],
                        strokeStyle: '#fff',
                        lineWidth: 0.5
                    },
                    plugin: {
                        wrap: {
                            min: { x: 0, y: 0 },
                            max: { x: render.options.width, y: render.options.height }
                        }
                    }
                });
                
                // 给粒子一个初始速度
                let force = 0.002 + Math.random() * 0.003;
                Matter.Body.applyForce(particle, particle.position, {
                    x: Math.cos(angle) * force,
                    y: Math.sin(angle) * force
                });
                
                Matter.World.add(world, particle);
                
                // 3秒后移除粒子
                setTimeout(() => {
                    Matter.World.remove(world, particle);
                }, 3000);
            }
        }

        function debounce(func, wait, immediate) {
            var timeout;
            return function() {
                var context = this, args = arguments;
                var later = function() {
                    timeout = null;
                    if (!immediate) func.apply(context, args);
                };
                var callNow = immediate && !timeout;
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
                if (callNow) func.apply(context, args);
            };
        }

        function typewriterEffect(element, text, speed = gameState.typewriterSpeed) {
            return new Promise((resolve) => {
                // 清除之前的内容和定时器
                if (gameState.typewriterTimeout) {
                    clearTimeout(gameState.typewriterTimeout);
                }
                
                element.innerHTML = '';
                element.classList.add('typewriter-text');
                gameState.isTyping = true;
                
                let charIndex = 0;
                const chars = text.split('');
                
                // 添加光标
                const cursor = document.createElement('span');
                cursor.className = 'typewriter-cursor';
                element.appendChild(cursor);
                
                function typeNextChar() {
                    if (charIndex < chars.length && gameState.isTyping) {
                        const char = chars[charIndex];
                        const span = document.createElement('span');
                        span.textContent = char;
                        span.className = 'char-appear';
                        
                        // 在光标前插入字符
                        element.insertBefore(span, cursor);
                        charIndex++;
                        
                        gameState.typewriterTimeout = setTimeout(typeNextChar, speed);
                    } else {
                        // 打字完成，移除光标
                        if (cursor.parentNode) {
                            cursor.remove();
                        }
                        gameState.isTyping = false;
                        element.classList.remove('typewriter-text');
                        resolve();
                    }
                }
                
                // 开始打字
                gameState.typewriterTimeout = setTimeout(typeNextChar, speed);
            });
        }

        // 跳过打字机效果
        function skipTypewriter() {
            if (gameState.isTyping && gameState.typewriterTimeout) {
                clearTimeout(gameState.typewriterTimeout);
                gameState.isTyping = false;
                
                // 立即显示完整文本
                const scene = gameData.scenes[gameState.currentScene];
                const dialog = scene.dialogs[gameState.currentDialog];
                if (dialog) {
                    dialogText.innerHTML = dialog.text || '';
                    dialogText.classList.remove('typewriter-text');
                    // 移除可能存在的光标
                    const cursor = dialogText.querySelector('.typewriter-cursor');
                    if (cursor) cursor.remove();
                }
            }
        }

        // 优化的防抖函数
        function debounce(func, wait) {
            let timeout;
            let lastArgs;
            return function executedFunction(...args) {
                lastArgs = args;
                const later = () => {
                    clearTimeout(timeout);
                    timeout = null;
                    func.apply(this, lastArgs);
                };
                if (timeout) {
                    clearTimeout(timeout);
                }
                timeout = setTimeout(later, wait);
            };
        }

        // 节流函数，避免过度频繁的调用
        function throttle(func, limit) {
            let inThrottle;
            return function(...args) {
                if (!inThrottle) {
                    func.apply(this, args);
                    inThrottle = true;
                    setTimeout(() => inThrottle = false, limit);
                }
            };
        }

        async function loadScene(sceneIndex) {
            if (gameState.isTransitioning) return;
            gameState.isTransitioning = true;

            const monitor = performanceMonitor();

            try {
                gameState.currentScene = sceneIndex;
                gameState.currentDialog = 0;
                
                const scene = gameData.scenes[sceneIndex];
                if (!scene) {
                    throw new Error(`Scene ${sceneIndex} not found`);
                }
                
                // 播放场景音乐
                audioManager.playSceneMusic(scene.id);
                
                // 并行加载背景和角色图片
                const backgroundPromise = imagePreloader.preload(scene.background);
                
                const characterImages = scene.dialogs
                    .flatMap(dialog => dialog.characters || [])
                    .map(char => char.image)
                    .filter(img => img);
                
                const charactersPromise = imagePreloader.preloadBatch([...new Set(characterImages)]);
                
                // 等待所有图片加载完成
                await Promise.allSettled([backgroundPromise, charactersPromise]);
                
                // 使用requestAnimationFrame优化背景设置
                requestAnimationFrame(() => {
                    background.style.backgroundImage = `url(${scene.background})`;
                    background.style.opacity = '1';
                });
                
                // 减少延迟，提高响应性
                await new Promise(resolve => {
                    setTimeout(() => {
                        requestAnimationFrame(() => {
                            dialogBox.classList.add('show');
                            showDialog();
                            resolve();
                        });
                    }, 200);
                });
            } catch (error) {
                console.error('场景加载失败:', error);
                // 更友好的错误处理，不阻断游戏
                setTimeout(() => {
                    console.log('尝试恢复场景加载');
                    showDialog();
                }, 1000);
            } finally {
                gameState.isTransitioning = false;
                monitor.end('loadScene');
            }
        }

        function showDialog() {
            try {
                const scene = gameData.scenes[gameState.currentScene];
                const dialog = scene.dialogs[gameState.currentDialog];
                
                if (!dialog) {

                // 取消之前的动画帧和打字机效果
                if (gameState.animationFrameId) {
                    cancelAnimationFrame(gameState.animationFrameId);
                }
                if (gameState.typewriterTimeout) {
                    clearTimeout(gameState.typewriterTimeout);
                }

                gameState.animationFrameId = requestAnimationFrame(() => {
                    dialogText.style.opacity = '0';
                    characterName.style.opacity = '0';
                    
                    setTimeout(async () => {
                        // 设置角色名称
                        characterName.textContent = dialog.character || '';

                            characterName.style.opacity = '1';

        async function showCharacters(characters) {
            try {
                // 使用throttle避免频繁的DOM操作
                [characterLeft, characterCenter, characterRight].forEach(char => {
                    char.classList.remove('show');
                    char.style.opacity = '0';
                });
                
                if (!characters || characters.length === 0) return;
                
                // 减少等待时间，提高响应性
                await new Promise(resolve => setTimeout(resolve, 150));
                
                // 批量预加载图片
                const imagePromises = characters
                    .filter(char => char.image)
                    .map(char => imagePreloader.preload(char.image));
                
                await Promise.allSettled(imagePromises);
                
                // 显示角色立绘
                const showPromises = characters.map(async (char, index) => {
                    const element = getCharacterElement(char.position);
                    if (!element || !char.image) return;
                    
                    try {
                        element.src = char.image;
                        element.alt = char.name || '';
                        
                        // 减少延迟，提高响应性
                        setTimeout(() => {
                            requestAnimationFrame(() => {
                                element.classList.add('show');
                                element.style.opacity = '1';
                            });
                        }, index * 100);
                    } catch (error) {
                        console.warn(`Failed to show character: ${char.image}`, error);
                    }
                });
                
                await Promise.allSettled(showPromises);
            } catch (error) {
                console.error('Failed to show characters:', error);
            }
        }

        function getCharacterElement(position) {
            switch(position) {
                case 'left': return characterLeft;
                case 'center': return characterCenter;
                case 'right': return characterRight;
                default: return null;
            }
        }

                        setTimeout(() => {
                            console.log('Jumping to:', choice.nextScene);
                            window.location.href = choice.nextScene;
                        }, 500);
                    } else {
                        const nextSceneIndex = gameData.scenes.findIndex(scene => scene.id === choice.nextScene);
                        if (nextSceneIndex !== -1) {
                            setTimeout(() => loadScene(nextSceneIndex), 500);
                        } else {
                            console.error(`Scene not found: ${choice.nextScene}`);
                        }
                    }
                } else {
                    setTimeout(() => nextDialog(), 300);
                }
            } catch (error) {
                console.error('Failed to make choice:', error);
                gameState.isTransitioning = false;
            }
        }

        // 点击页面任意位置继续对话（优化版 + 打字机支持）
        document.addEventListener('click', throttle(debounce((e) => {
            // 检查点击的元素是否应该被忽略
            const clickedElement = e.target;
            const excludeSelectors = [
                '.choice-btn',           // 选择按钮
                '.control-btn',          // 控制按钮
                '#start-btn',            // 开始按钮
                '.dg',                   // GUI控制面板
                '.dg *'                  // GUI控制面板内的所有元素
            ];
            
            // 检查是否点击了需要排除的元素
            const shouldExclude = excludeSelectors.some(selector => {
                if (selector.includes('*')) {
                    // 处理通配符选择器
                    const baseSelector = selector.replace(' *', '');
                    return clickedElement.closest(baseSelector);
                }
                return clickedElement.matches(selector) || clickedElement.closest(selector);
            });
            
            // 检查是否在标题界面
            const titleScreen = document.getElementById('title-screen');
            const isOnTitleScreen = titleScreen && titleScreen.style.display !== 'none';
            
            // 如果在标题界面或点击了排除的元素，则不执行对话继续逻辑
            if (isOnTitleScreen || shouldExclude) {
                return;
            }
            
            // 执行对话继续逻辑
            if (!gameState.autoMode && !gameState.skipMode && !gameState.isTransitioning) {

                    nextDialog();
                    break;
                case 'Enter': // 回车键继续
                    e.preventDefault();
                    nextDialog();
                    break;
                case 'c': // C键强制显示选择（调试用）
                case 'C':
                    e.preventDefault();
                    const scene = gameData.scenes[gameState.currentScene];
                    const dialog = scene?.dialogs[gameState.currentDialog];
                    if (dialog?.choices && dialog.choices.length > 0) {
                        console.log('手动触发选择显示');
                        // 强制重新初始化容器
                        initChoicesContainer();
                        setTimeout(() => showChoices(dialog.choices), 100);
                    } else {
                        console.log('当前对话没有选择项');
                    }
                    break;
                case 'd': // D键调试信息
                case 'D':
                    e.preventDefault();
                    debugChoicesState();
                    break;
            }
        });

        setInterval(() => {
            if (gameState.autoMode) {
                const scene = gameData.scenes[gameState.currentScene];
                const dialog = scene.dialogs[gameState.currentDialog];

                if (dialog && (!dialog.choices || dialog.choices.length === 0)) {
                    setTimeout(nextDialog, 3000);
                }
            }
        }, 1000);



        // 内存清理函数
        function cleanupResources() {
            // 清理动画帧
            if (gameState.animationFrameId) {
                cancelAnimationFrame(gameState.animationFrameId);
                gameState.animationFrameId = null;
            }
            
            // 清理打字机定时器
            if (gameState.typewriterTimeout) {
                clearTimeout(gameState.typewriterTimeout);
                gameState.typewriterTimeout = null;
            }
            
            // 清理事件监听器
            const buttons = choices.querySelectorAll('.choice-btn');
            buttons.forEach(btn => {
                const newBtn = btn.cloneNode(true);
                btn.parentNode.replaceChild(newBtn, btn);
            });
            
            console.log('资源已清理');
        }

        // 性能监控
        function performanceMonitor() {
            const startTime = performance.now();
            
            return {
                end: (operation) => {
                    const endTime = performance.now();
                    const duration = endTime - startTime;
                    
                    if (duration > 100) { // 超过100ms的操作
                        console.warn(`慢操作检测: ${operation} 耗时 ${duration.toFixed(2)}ms`);
                    }
                }
            };
        }

        window.addEventListener('beforeunload', () => {
            cleanupResources();
            if (clickEffectSystem) {
                cleanupEffectSystem();
            }
            // 清理音频
            if (audioManager) {
                audioManager.stop(false);
            }
        });

        window.addEventListener('error', (e) => {
            console.error('全局错误捕获:', e.error);
            if (gameState.isTransitioning) {
                gameState.isTransitioning = false;
            }
            // 尝试恢复游戏状态
            setTimeout(() => {
                if (!gameState.isTransitioning) {
                    console.log('尝试恢复游戏状态');
                    initChoicesContainer();
                }
            }, 1000);
        });

        document.addEventListener('DOMContentLoaded', () => {
            console.log('第三章：荒诞的迷宫 已加载');
            
            // 初始化选择按钮容器
            initChoicesContainer();
            
            // 初始化音频系统
            audioManager.init();
            audioManager.updateAudioButton();
            
            // 初始化点击特效系统
            try {
                let m = createWorld();
                setWindowSize();
                $(window).resize(debounce(setWindowSize, 250));
                clickEffectSystem = m; // 保存引用以便后续清理
            } catch (error) {
                console.warn('点击特效系统初始化失败:', error);
            }
            
            // 检查是否从小游戏返回
            const minigame1Completed = localStorage.getItem('minigame1_completed');
            const minigame2Completed = localStorage.getItem('minigame2_completed');
            
            if (minigame1Completed === 'true') {
                console.log('检测到从小游戏1返回，直接跳转到成功场景');
                // 如果从小游戏返回，直接初始化游戏（会跳转到成功场景）
                initGame();
            } else if (minigame2Completed === 'true') {
                console.log('检测到从小游戏2返回，直接跳转到成功场景');
                // 如果从小游戏返回，直接初始化游戏（会跳转到成功场景）
                initGame();
            }
        });

        // 页面卸载时清理资源
        window.addEventListener('beforeunload', () => {
            if (clickEffectSystem) {
                cleanupEffectSystem();
            }
            if (audioManager) {
                audioManager.stop(false);
            }
        });
    </script>
</body>
</html>
