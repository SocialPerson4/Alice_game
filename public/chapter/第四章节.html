<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第四幕：疯狂茶话会 - 爱丽丝漫游仙境</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap" rel="stylesheet">
    <!-- 特效相关库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.17.1/matter.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/matter-attractors@0.1.6/build/matter-attractors.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/matter-wrap@1.1.1/build/matter-wrap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
    <style>
        body {
            font-family: 'Noto Serif SC', serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* 主游戏容器 */
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
            transition: background 1s ease-in-out;
        }

        #game-container.show {
            background: #000;
        }

        /* 开场艺术字 */
        #title-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('../img/第四章进入背景.jpg') center center/cover no-repeat,
                        linear-gradient(135deg, rgba(102, 126, 234, 0.6) 0%, rgba(118, 75, 162, 0.6) 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            opacity: 1;
            transition: opacity 2s ease;
        }

        #title-screen.hide {
            opacity: 0;
            pointer-events: none;
        }

        #title-screen h1 {
            font-size: 4rem;
            color: white;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            margin-bottom: 30px;
            animation: titleGlow 2s ease-in-out infinite alternate;
        }

        @keyframes titleGlow {
            from { text-shadow: 0 0 20px rgba(255, 255, 255, 0.5); }
            to { text-shadow: 0 0 30px rgba(255, 105, 180, 0.8); }
        }

        /* 过渡动画容器 */
        #transition-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 150;
            background: #000;
            display: none;
        }

        #transition-video video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 背景图片 */
        #background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-image: url('./img/第四章素材/茶话会.jpg');
            transition: opacity 1s ease-in-out;
            opacity: 0;
            z-index: 1;
        }

        #background.show {
            opacity: 1;
        }

        /* 固定时钟 */
        #fixed-clock {
            position: absolute;
            top: 10%;
            right: 15%;
            width: 150px;
            height: 150px;
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            background-image: url('./img/第四章素材/六点钟时钟.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            z-index: 15;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: #1a1a2e;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
        }

        #fixed-clock::before {
            content: '';
            position: absolute;
            top: -10px;
            left: -10px;
            right: -10px;
            bottom: -10px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 215, 0, 0.4) 0%, rgba(255, 140, 0, 0.2) 50%, transparent 70%);
            animation: clockGlow 3s ease-in-out infinite alternate;
            z-index: -1;
        }

        @keyframes clockGlow {
            0% { 
                transform: scale(0.8);
                opacity: 0.3;
            }
            100% { 
                transform: scale(1.2);
                opacity: 0.7;
            }
        }

        #fixed-clock:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 25px rgba(255, 215, 0, 0.4);
        }

        #fixed-clock:hover::before {
            transform: scale(1.4);
            opacity: 0.9;
        }

        /* 角色立绘 */
        .character {
            position: absolute;
            bottom: 0;
            height: 70vh;
            max-width: 40vw;
            transition: all 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            opacity: 0;
            transform: translateX(-100px);
            z-index: 10;
            filter: drop-shadow(0 5px 15px rgba(0, 0, 0, 0.3));
            cursor: pointer;
        }

        .character.left {
            left: 5%;
        }

        .character.right {
            right: 15%;
            transform: translateX(100px);
        }

        .character.show {
            opacity: 1;
            transform: translateX(0);
        }

        .character:hover {
            transform: translateY(-5px) scale(1.02);
            filter: drop-shadow(0 8px 20px rgba(138, 43, 226, 0.4));
        }

        /* 桌子上的物品 */
        .table-items {
            position: absolute;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            width: 70%;
            height: 25%;
            z-index: 12;
        }

        .clickable-item {
            position: absolute;
            width: 100px;
            height: 100px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            border-radius: 15px;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.3));
            opacity: 0.9;
        }

        .clickable-item:hover {
            transform: translateY(-8px) scale(1.1);
            filter: drop-shadow(0 8px 20px rgba(138, 43, 226, 0.5));
            opacity: 1;
        }

        .heart-cup {
            top: 20%;
            left: 15%;
            background-image: url('./img/第四章素材/心形茶杯.png');
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.8), 0 0 50px rgba(255, 140, 0, 0.6), 0 0 75px rgba(255, 69, 0, 0.4);
            animation: cakeFloat 3s ease-in-out infinite 0.5s, cakeGlow 2s ease-in-out infinite alternate 0.3s;
        }

        .gear-teapot {
            top: 10%;
            right: 25%;
            background-image: url('./img/第四章素材/齿轮茶壶.png');
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.8), 0 0 50px rgba(255, 140, 0, 0.6), 0 0 75px rgba(255, 69, 0, 0.4);
            animation: cakeFloat 3s ease-in-out infinite 1s, cakeGlow 2s ease-in-out infinite alternate 0.7s;
        }

        .glowing-cake {
            top: 40%;
            right: 10%;
            background-image: url('./img/第四章素材/发光蛋糕.png');
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.8), 0 0 50px rgba(255, 140, 0, 0.6), 0 0 75px rgba(255, 69, 0, 0.4);
            animation: cakeFloat 3s ease-in-out infinite, cakeGlow 2s ease-in-out infinite alternate;
        }

        @keyframes cakeFloat {
            0%, 100% { 
                transform: translateY(0px);
            }
            50% { 
                transform: translateY(-10px);
            }
        }

        @keyframes cakeGlow {
            0% { 
                box-shadow: 0 0 20px rgba(255, 215, 0, 0.6), 0 0 40px rgba(255, 140, 0, 0.4), 0 0 60px rgba(255, 69, 0, 0.3);
                filter: brightness(1) drop-shadow(0 0 8px rgba(255, 215, 0, 0.4));
            }
            100% { 
                box-shadow: 0 0 40px rgba(255, 215, 0, 1), 0 0 80px rgba(255, 140, 0, 0.8), 0 0 120px rgba(255, 69, 0, 0.6);
                filter: brightness(1.4) drop-shadow(0 0 15px rgba(255, 215, 0, 0.7));
            }
        }

        .chain-cards {
            top: 50%;
            left: 45%;
            background-image: url('./img/第四章素材/锁链纸牌.png');
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.8), 0 0 50px rgba(255, 140, 0, 0.6), 0 0 75px rgba(255, 69, 0, 0.4);
            animation: cakeFloat 3s ease-in-out infinite 1.5s, cakeGlow 2s ease-in-out infinite alternate 1.2s;
        }

        /* 悬浮提示 */
        #tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.9);
            color: #ffd700;
            padding: 8px 12px;
            border-radius: 5px;
            font-size: 0.9rem;
            pointer-events: none;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.3s ease;
            white-space: nowrap;
        }

        #tooltip.show {
            opacity: 1;
        }

        /* 对话框 */
        #dialog-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 800px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            opacity: 0;
            transform: translateX(-50%) translateY(50px);
            transition: all 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            z-index: 20;
            border: 2px solid rgba(138, 43, 226, 0.2);
        }

        #dialog-box.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        #character-name {
            font-size: 1.2rem;
            font-weight: bold;
            color: #8a2be2;
            margin-bottom: 10px;
            text-shadow: 0 0 5px rgba(138, 43, 226, 0.3);
        }

        #dialog-text {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #333;
            min-height: 60px;
        }

        /* 打字机效果 */
        .typewriter-text {
            overflow: hidden;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .typewriter-cursor {
            display: inline-block;
            width: 2px;
            height: 1.2em;
            background-color: #8a2be2;
            margin-left: 2px;
            animation: blink-cursor 1s infinite;
        }

        @keyframes blink-cursor {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        /* 文字逐个显示动画 */
        .char-appear {
            opacity: 0;
            animation: charFadeIn 0.1s ease-in forwards;
        }

        @keyframes charFadeIn {
            from { 
                opacity: 0; 
                transform: translateY(10px);
            }
            to { 
                opacity: 1; 
                transform: translateY(0);
            }
        }

        /* 详细信息弹窗 */
        #item-info-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 300;
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s ease;
            backdrop-filter: blur(10px);
        }

        #item-info-modal.show {
            opacity: 1;
            visibility: visible;
        }

        #item-info-content {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(15px);
            padding: 40px;
            border-radius: 20px;
            border: 2px solid rgba(138, 43, 226, 0.3);
            max-width: 600px;
            text-align: center;
            transform: scale(0.8);
            transition: transform 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        #item-info-modal.show #item-info-content {
            transform: scale(1);
        }

        #item-info-title {
            color: #8a2be2;
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 20px;
            text-shadow: 0 0 5px rgba(138, 43, 226, 0.3);
        }

        #item-info-text {
            color: #333;
            font-size: 1.2rem;
            line-height: 1.6;
        }

        .close-btn {
            background: linear-gradient(135deg, #ff69b4, #8a2be2);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 25px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .close-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        /* 控制按钮 */
        #controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            padding: 10px 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
        }



        /* 淡入淡出效果 */
        .fade-in {
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* 最终选择界面样式 */
        .final-choice-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(15px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 300;
            opacity: 0;
            visibility: hidden;
            transition: all 0.5s ease;
        }

        .final-choice-container.show {
            opacity: 1;
            visibility: visible;
        }

        .final-choice-title {
            color: #ffd700;
            font-size: 2.8rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
            animation: titleGlow 2s ease-in-out infinite alternate;
        }

        .final-choice-subtitle {
            color: #ffffff;
            font-size: 1.4rem;
            text-align: center;
            margin-bottom: 40px;
            max-width: 800px;
            line-height: 1.6;
        }

        .final-choice-buttons {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .final-choice-btn {
            background: linear-gradient(135deg, #ff69b4, #8a2be2);
            color: white;
            border: none;
            padding: 20px 40px;
            border-radius: 30px;
            font-size: 1.3rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            min-width: 220px;
            text-align: center;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .final-choice-btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 40px rgba(138, 43, 226, 0.4);
            border-color: rgba(255, 255, 255, 0.6);
        }

        .final-choice-btn.restart {
            background: linear-gradient(135deg, #4CAF50, #45a049);
        }

        .final-choice-btn.restart:hover {
            box-shadow: 0 15px 40px rgba(76, 175, 80, 0.4);
        }

        .final-choice-btn.chapter5 {
            background: linear-gradient(135deg, #FF6B35, #F7931E);
        }

        .final-choice-btn.chapter5:hover {
            box-shadow: 0 15px 40px rgba(255, 107, 53, 0.4);
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            #title-screen h1 {
                font-size: 2.5rem;
            }
            
            .character {
                height: 50vh;
                max-width: 45vw;
            }
            
            #dialog-box {
                width: 95%;
                padding: 15px;
            }
            
            #fixed-clock {
                width: 100px;
                height: 100px;
            }
            
            .clickable-item {
                width: 80px;
                height: 80px;
            }

            .final-choice-title {
                font-size: 2.2rem;
            }
            
            .final-choice-subtitle {
                font-size: 1.2rem;
                padding: 0 20px;
            }
            
            .final-choice-buttons {
                flex-direction: column;
                gap: 20px;
            }
            
            .final-choice-btn {
                min-width: 280px;
                padding: 15px 30px;
                font-size: 1.1rem;
            }
        }

        /* 粒子特效样式 */
        #effect-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 5;
        }

        /* 特效相关样式 */
        #wrapper-canvas {
            width: 100vw;
            height: 100vh;
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 5;
            pointer-events: auto;
        }

        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(rgba(85, 85, 85, 0.1) 1px, transparent 1px),
            linear-gradient(90deg, rgba(85, 85, 85, 0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 1;
            animation: pulse 4s infinite;
            pointer-events: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.1; }
            50% { opacity: 0.3; }
        }

        .dg.ac {
            position: fixed !important;
            top: 0;
            left: 0;
            width: 300px !important;
            max-width: 300px !important;
            z-index: 1000;
            opacity: 0.8;
        }

        .dg .dg.main {
            width: 300px !important;
        }

        .dg .close-button {
            width: 300px !important;
        }
    </style>
</head>
<body>
    <!-- 网格背景特效 -->
    <div class="grid-overlay"></div>

    <!-- 特效画布 -->
    <div id="wrapper-canvas"></div>

    <!-- 开场艺术字 -->
    <div id="title-screen">
        <h1>第四幕：疯狂茶话会</h1>
    </div>

    <!-- 过渡动画 -->
    <div id="transition-video">
        <video id="transition-video-element" muted>
            <source src="./img/第四章素材/过渡动画.mp4" type="video/mp4">
        </video>
    </div>

    <!-- 主游戏容器 -->
    <div id="game-container">
        <!-- 背景 -->
        <div id="background"></div>
        
        <!-- 固定时钟 -->
        <div id="fixed-clock">6:00</div>

        <!-- 角色立绘 -->
        <img id="mad-hatter" class="character left" src="./img/第四章素材/疯帽子.png" alt="疯帽子">
        <img id="march-hare" class="character right" src="./img/第四章素材/三月兔.jpg" alt="三月兔">

        <!-- 桌子上的物品 -->
        <div class="table-items">
            <div class="clickable-item heart-cup" data-item="heart-cup"></div>
            <div class="clickable-item gear-teapot" data-item="gear-teapot"></div>
            <div class="clickable-item glowing-cake" data-item="glowing-cake"></div>
            <div class="clickable-item chain-cards" data-item="chain-cards"></div>
        </div>

        <!-- 悬浮提示 -->
        <div id="tooltip"></div>

        <!-- 对话框 -->
        <div id="dialog-box">
            <div id="character-name"></div>
            <div id="dialog-text"></div>
        </div>

        <!-- 控制按钮 -->
        <div id="controls">
            <button class="control-btn" id="audio-btn" title="音频开关">🔊 音频</button>
        </div>
    </div>

    <!-- 物品详细信息模态框 -->
    <div id="item-info-modal">
        <div id="item-info-content">
            <div id="item-info-title"></div>
            <div id="item-info-text"></div>
            <button class="close-btn" onclick="closeItemInfo()">关闭</button>
        </div>
    </div>

    <!-- 最终选择界面 -->
    <div class="final-choice-container" id="final-choice-container">
        <div class="final-choice-title">第四章：疯狂茶话会 完成</div>
        <div class="final-choice-subtitle">
            柴郡猫的声音在她耳边低语："恭喜你，小爱丽丝。你触碰到了时间的秘密，触碰了仙境所谓的规则。审判即将开始，你准备好了吗？"
        </div>
        <div class="final-choice-buttons">
            <button class="final-choice-btn restart" onclick="restartFromFinalChoice()">
                🔄 重新开始第四章<br><small>重新体验疯狂茶话会</small>
            </button>
            <button class="final-choice-btn chapter5" onclick="showChapter5Message()">
                ⚖️ 进入第五章<br><small>抉择的审判（敬请期待）</small>
            </button>
        </div>
        <div style="margin-top: 30px; color: #aaa; font-size: 0.9rem;">
            使用鼠标点击选择您的下一步行动
        </div>
    </div>

    <script>
        // 游戏状态
        const gameState = {
            currentPhase: 'opening',
            dialogVisible: false,
            timeGameCompleted: false,
            itemsExplored: [],
            charactersInteracted: [],
            isTransitioning: false,
            typewriterSpeed: 50, // 打字机速度（毫秒）

            currentMusic: null,
            isTransitioning: false,
            audioEnabled: true,
            defaultVolume: 0.6,
            fadeTime: 2000, // 淡入淡出时间（毫秒）
            
            // 初始化音频系统
            init() {
                this.bgMusic.volume = this.defaultVolume;
                this.bgMusic.loop = true;
                
                this.bgMusic.addEventListener('ended', () => {
                    if (this.currentMusic && this.audioEnabled) {
                        this.bgMusic.play().catch(e => console.log('音频播放失败:', e));
                    }
                });
                
                // 处理音频加载错误
                this.bgMusic.addEventListener('error', (e) => {
                    console.warn('音频加载错误:', e);
                });
                
                // 初始化音频按钮
                this.updateAudioButton();
                
                console.log('第四章音频系统初始化完成');
            },
            
            // 播放指定音频
            async playMusic(musicPath, fadeIn = true) {
                if (!this.audioEnabled) {
                    console.log('音频已关闭，跳过播放');
                    return;
                }
                
                if (this.isTransitioning) {
                    return;
                }
                
                // 如果是相同音乐但当前已暂停，则重新播放
                if (this.currentMusic === musicPath && !this.bgMusic.paused) {
                    return;
                }
                
                console.log('切换音频到:', musicPath);
                this.isTransitioning = true;
                
                try {
                    // 如果当前有音乐在播放，先淡出
                    if (!this.bgMusic.paused && this.currentMusic) {
                        await this.fadeOut();
                    }
                    
                    // 设置新音频源
                    this.bgMusic.src = musicPath;
                    this.currentMusic = musicPath;
                    
                    // 等待音频加载
                    await new Promise((resolve) => {
                        this.bgMusic.addEventListener('canplaythrough', resolve, { once: true });
                        this.bgMusic.load();
                    });
                    
                    // 播放新音频
                    if (fadeIn) {
                        this.bgMusic.volume = 0;
                        await this.bgMusic.play();
                        await this.fadeIn();
                    } else {
                        this.bgMusic.volume = this.defaultVolume;
                        await this.bgMusic.play();
                    }
                    
                    console.log('音频播放成功:', musicPath, '音量:', this.bgMusic.volume);
                    
                } catch (error) {
                    console.warn('音频播放失败:', error);
                    // 重置状态以便下次尝试
                    this.bgMusic.volume = this.defaultVolume;
                    this.currentMusic = null;
                } finally {
                    this.isTransitioning = false;
                }
            },
            
            // 淡入效果
            fadeIn() {
                return new Promise((resolve) => {
                    const startVolume = 0;
                    const endVolume = this.defaultVolume;
                    const steps = 50;
                    const stepTime = this.fadeTime / steps;
                    const volumeStep = (endVolume - startVolume) / steps;
                    
                    let currentStep = 0;
                    const fadeInterval = setInterval(() => {
                        currentStep++;
                        const newVolume = startVolume + (volumeStep * currentStep);
                        this.bgMusic.volume = Math.min(newVolume, endVolume);
                        
                        if (currentStep >= steps) {
                            clearInterval(fadeInterval);
                            this.bgMusic.volume = endVolume;
                            resolve();
                        }
                    }, stepTime);
                });
            },
            
            // 淡出效果
            fadeOut() {
                return new Promise((resolve) => {
                    const startVolume = this.bgMusic.volume;
                    const endVolume = 0;
                    const steps = 50;
                    const stepTime = this.fadeTime / steps;
                    const volumeStep = (startVolume - endVolume) / steps;
                    
                    let currentStep = 0;
                    const fadeInterval = setInterval(() => {
                        currentStep++;
                        const newVolume = startVolume - (volumeStep * currentStep);
                        this.bgMusic.volume = Math.max(newVolume, endVolume);
                        
                        if (currentStep >= steps) {
                            clearInterval(fadeInterval);
                            this.bgMusic.volume = endVolume;
                            this.bgMusic.pause();
                            resolve();
                        }
                    }, stepTime);
                });
            },
            
            // 停止音频
            async stop(fade = true) {
                if (this.bgMusic.paused) return;
                
                if (fade) {
                    await this.fadeOut();
                } else {
                    this.bgMusic.pause();
                    this.bgMusic.volume = 0;
                }
                
                // 重置过渡状态
                this.isTransitioning = false;
            },
            
            // 切换音频开关
            toggleAudio() {
                this.audioEnabled = !this.audioEnabled;

                    // 关闭音频时停止播放

        // 优化的防抖函数
        function debounce(func, wait, immediate) {
            var timeout;
            var lastArgs;
            return function() {
                var context = this, args = arguments;
                lastArgs = args;
                var later = function() {
                    timeout = null;
                    if (!immediate) func.apply(context, lastArgs);
                };
                var callNow = immediate && !timeout;
                if (timeout) {
                    clearTimeout(timeout);
                }
                timeout = setTimeout(later, wait);
                if (callNow) func.apply(context, args);
            };
        }

            return function(...args) {

                    func.apply(this, args);
                    inThrottle = true;
                    setTimeout(() => inThrottle = false, limit);
                }
            };

                // 检查是否点击了需要排除的元素
                const shouldExclude = excludeSelectors.some(selector => {
                    if (selector.includes('*')) {
                        // 处理通配符选择器
                        const baseSelector = selector.replace(' *', '');
                        return clickedElement.closest(baseSelector);
                    }
                    return clickedElement.matches(selector) || clickedElement.closest(selector);
                });
                
                // 检查是否在标题界面或最终选择界面
                const titleScreen = document.getElementById('title-screen');
                const finalChoiceContainer = document.getElementById('final-choice-container');
                const isOnTitleScreen = titleScreen && !titleScreen.classList.contains('hide');
                const isOnFinalChoice = finalChoiceContainer && finalChoiceContainer.classList.contains('show');
                
                // 如果在标题界面、最终选择界面或点击了排除的元素，则不执行对话继续逻辑
                if (isOnTitleScreen || isOnFinalChoice || shouldExclude) {
                    return;
                }
                
                // 执行对话继续逻辑
                if (gameState.dialogVisible) {
                    if (gameState.isTyping) {
                        skipTypewriter();
                    } else {
                        hideDialog();
                    }
                }
            }, 100), 50));

            // 音频按钮点击事件
            const audioBtn = document.getElementById('audio-btn');
            if (audioBtn) {
                audioBtn.addEventListener('click', debounce(() => {
                    audioManager.toggleAudio();
                }, 300));
            }

            // 键盘快捷键

            monitor.end('setupEventListeners');

        }

        // 打字机效果函数
        function typewriterEffect(element, text, speed = gameState.typewriterSpeed) {
            return new Promise((resolve) => {
                // 清除之前的内容和定时器
                if (gameState.typewriterTimeout) {
                    clearTimeout(gameState.typewriterTimeout);
                }
                
                element.innerHTML = '';
                element.classList.add('typewriter-text');
                gameState.isTyping = true;
                
                let charIndex = 0;
                const chars = text.split('');
                
                // 添加光标
                const cursor = document.createElement('span');
                cursor.className = 'typewriter-cursor';
                element.appendChild(cursor);
                
                function typeNextChar() {
                    if (charIndex < chars.length && gameState.isTyping) {
                        const char = chars[charIndex];
                        const span = document.createElement('span');
                        span.textContent = char;
                        span.className = 'char-appear';
                        
                        // 在光标前插入字符
                        element.insertBefore(span, cursor);
                        charIndex++;
                        
                        gameState.typewriterTimeout = setTimeout(typeNextChar, speed);
                    } else {
                        // 打字完成，移除光标
                        if (cursor.parentNode) {
                            cursor.remove();
                        }
                        gameState.isTyping = false;
                        element.classList.remove('typewriter-text');
                        resolve();
                    }
                }
                
                // 开始打字
                gameState.typewriterTimeout = setTimeout(typeNextChar, speed);
            });
        }

        // 跳过打字机效果（修复版）
        function skipTypewriter() {
            const monitor = performanceMonitor();
            console.log('跳过打字机效果');
            
            if (gameState.isTyping && gameState.typewriterTimeout) {
                clearTimeout(gameState.typewriterTimeout);
                gameState.isTyping = false;
                
                // 立即显示完整文本
                if (elements.dialogText.dataset.fullText) {
                    requestAnimationFrame(() => {
                        elements.dialogText.innerHTML = elements.dialogText.dataset.fullText;
                        elements.dialogText.classList.remove('typewriter-text');
                        // 移除可能存在的光标
                        const cursor = elements.dialogText.querySelector('.typewriter-cursor');
                        if (cursor) cursor.remove();
                    });
                    console.log('打字机效果已跳过，显示完整文本');
                }
            }
            
            monitor.end('skipTypewriter');
        }

            const monitor = performanceMonitor();

        // 键盘事件处理（增强版）
        function handleKeyPress(event) {
            switch(event.key) {
                case ' ': // 空格键继续
                case 'Enter': // 回车键继续
                    event.preventDefault();
                    if (gameState.dialogVisible) {
                        if (gameState.isTyping) {
                            skipTypewriter();
                        } else {
                            hideDialog();
                        }
                    }
                    break;
                case 'Escape': // ESC键关闭
                    event.preventDefault();
                    if (elements.itemInfoModal.classList.contains('show')) {
                        closeItemInfo();
                    } else if (gameState.dialogVisible) {
                        hideDialog();
                    }
                    break;
                case 's': // S键保存
                case 'S':
                    event.preventDefault();
                    saveGame();
                    break;
                case 'l': // L键读取
                case 'L':
                    event.preventDefault();
                    loadGame();
                    break;
                case 'd': // D键调试信息
                case 'D':
                    event.preventDefault();
                    debugGameState();
                    break;
                case 'm': // M键切换音频
                case 'M':
                    event.preventDefault();
                    audioManager.toggleAudio();
                    break;
                case 'a': // A键调试音频状态
                case 'A':
                    event.preventDefault();
                    console.log('=== 音频状态调试 ===');
                    console.log('音频启用:', audioManager.audioEnabled);

                    console.log('正在转换:', audioManager.isTransitioning);
                    console.log('游戏阶段:', gameState.currentPhase);
                    console.log('==================');
                    break;
            }
        }

            // 清理打字机定时器
            if (gameState.typewriterTimeout) {
                clearTimeout(gameState.typewriterTimeout);
                gameState.typewriterTimeout = null;
            }
            
            // 清理音频资源
            if (audioManager && audioManager.bgMusic) {
                audioManager.stop(false); // 立即停止，不淡出
                audioManager.bgMusic.src = '';
                audioManager.currentMusic = null;
            }
            
            // 清理其他定时器
            const highestTimeoutId = setTimeout(() => {});
            for (let i = 0; i < highestTimeoutId; i++) {
                clearTimeout(i);
            }
            
            // 清理事件监听器（通过克隆节点）
            const elementsToClean = [
                elements.madHatter,
                elements.marchHare,
                elements.fixedClock,
                ...document.querySelectorAll('.clickable-item')
            ];
            
            elementsToClean.forEach(element => {
                if (element && element.parentNode) {
                    const newElement = element.cloneNode(true);
                    element.parentNode.replaceChild(newElement, element);
                }
            });
            
            console.log('第四章资源已清理');
        }

        // 错误恢复机制
        function handleError(error, context) {
            console.error(`第四章错误 [${context}]:`, error);
            
            // 尝试恢复游戏状态
            setTimeout(() => {
                if (gameState.isTransitioning) {
                    gameState.isTransitioning = false;
                }
                if (gameState.isTyping) {
                    gameState.isTyping = false;
                }
                console.log('尝试恢复游戏状态完成');
            }, 1000);
        }

        // 页面加载完成后初始化（优化版）
        document.addEventListener('DOMContentLoaded', () => {
            const monitor = performanceMonitor();
            
            try {
                // 初始化点击特效系统
                let m = createWorld();
                setWindowSize();
                $(window).resize(throttle(debounce(setWindowSize, 250), 100));
                clickEffectSystem = m; // 保存引用以便后续清理
                
                initGame();
                checkTimeGameCompletion();
                checkMirrorHouseCompletion();
                
                monitor.end('DOMContentLoaded');
                console.log('第四章初始化完成');
            } catch (error) {
                handleError(error, 'DOMContentLoaded');
            }
        });

        // 页面可见性变化处理（优化版）
        document.addEventListener('visibilitychange', throttle(() => {
            try {
                if (!document.hidden) {
                    checkTimeGameCompletion();
                    checkMirrorHouseCompletion();
                }
            } catch (error) {
                handleError(error, 'visibilitychange');
            }
        }, 500));

        // 窗口错误处理
        window.addEventListener('error', (e) => {
            handleError(e.error, 'window.error');
        });

        // 页面卸载时清理资源（增强版）
        window.addEventListener('beforeunload', () => {
            try {
                cleanupResources();
                if (clickEffectSystem) {
                    cleanupEffectSystem();
                }
                console.log('第四章资源清理完成');
            } catch (error) {
                console.warn('资源清理失败:', error);
            }
        });
    </script>
</body>
